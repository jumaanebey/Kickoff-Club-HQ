<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <!-- Fire gradient -->
    <linearGradient id="fireGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="50%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background energy burst lines -->
  <g opacity="0.6">
    <line x1="300" y1="100" x2="50" y2="30" stroke="#f97316" stroke-width="3"/>
    <line x1="300" y1="100" x2="550" y2="30" stroke="#f97316" stroke-width="3"/>
    <line x1="300" y1="100" x2="50" y2="170" stroke="#f97316" stroke-width="3"/>
    <line x1="300" y1="100" x2="550" y2="170" stroke="#f97316" stroke-width="3"/>
    <line x1="300" y1="100" x2="100" y2="100" stroke="#fbbf24" stroke-width="2"/>
    <line x1="300" y1="100" x2="500" y2="100" stroke="#fbbf24" stroke-width="2"/>
  </g>

  <!-- Main text with effects -->
  <text x="300" y="130"
        font-family="Impact, Arial Black, sans-serif"
        font-size="100"
        font-weight="bold"
        text-anchor="middle"
        fill="url(#fireGradient)"
        stroke="#7c2d12"
        stroke-width="3"
        filter="url(#glow)">
    JUKED!
  </text>

  <!-- Highlight overlay -->
  <text x="300" y="130"
        font-family="Impact, Arial Black, sans-serif"
        font-size="100"
        font-weight="bold"
        text-anchor="middle"
        fill="none"
        stroke="#fef3c7"
        stroke-width="1"
        opacity="0.5">
    JUKED!
  </text>
</svg>