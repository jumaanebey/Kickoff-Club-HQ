<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93c5fd"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <filter id="shieldGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer glow -->
  <path d="M32 6 L52 14 L52 32 C52 46 32 58 32 58 C32 58 12 46 12 32 L12 14 Z"
        fill="#3b82f6" opacity="0.3" filter="url(#shieldGlow)"/>

  <!-- Shield body -->
  <path d="M32 8 L50 15 L50 32 C50 44 32 55 32 55 C32 55 14 44 14 32 L14 15 Z"
        fill="url(#shieldBlue)" stroke="#1e40af" stroke-width="2"/>

  <!-- Inner shield -->
  <path d="M32 14 L44 19 L44 32 C44 40 32 48 32 48 C32 48 20 40 20 32 L20 19 Z"
        fill="url(#shieldInner)" stroke="#3b82f6" stroke-width="1"/>

  <!-- Star emblem -->
  <polygon points="32,22 34,28 40,28 35,32 37,38 32,35 27,38 29,32 24,28 30,28"
           fill="#dbeafe" stroke="#93c5fd" stroke-width="0.5"/>

  <!-- Shine highlight -->
  <ellipse cx="24" cy="22" rx="4" ry="6" fill="white" opacity="0.3" transform="rotate(-20 24 22)"/>
</svg>