<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="magnetRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fca5a5"/>
      <stop offset="50%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#b91c1c"/>
    </linearGradient>
    <filter id="magnetGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Glow effect -->
  <path d="M16 48 L16 28 A16 16 0 0 1 48 28 L48 48" fill="none" stroke="#ef4444" stroke-width="12" opacity="0.3" filter="url(#magnetGlow)"/>

  <!-- Magnet body - left arm -->
  <path d="M12 52 L12 28 A20 20 0 0 1 24 10" fill="none" stroke="url(#magnetRed)" stroke-width="10" stroke-linecap="round"/>

  <!-- Magnet body - right arm -->
  <path d="M52 52 L52 28 A20 20 0 0 0 40 10" fill="none" stroke="url(#magnetRed)" stroke-width="10" stroke-linecap="round"/>

  <!-- Top curve -->
  <path d="M24 10 A12 12 0 0 1 40 10" fill="none" stroke="url(#magnetRed)" stroke-width="10" stroke-linecap="round"/>

  <!-- Silver tips - left -->
  <rect x="7" y="44" width="10" height="12" rx="2" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>

  <!-- Silver tips - right -->
  <rect x="47" y="44" width="10" height="12" rx="2" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>

  <!-- Magnetic field lines -->
  <path d="M20 56 Q32 62 44 56" fill="none" stroke="#fecaca" stroke-width="1" opacity="0.6"/>
  <path d="M22 60 Q32 64 42 60" fill="none" stroke="#fecaca" stroke-width="1" opacity="0.4"/>
</svg>