<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="coinGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="30%" style="stop-color:#fbbf24"/>
      <stop offset="70%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <filter id="coinGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer glow -->
  <circle cx="32" cy="32" r="28" fill="#fbbf24" opacity="0.3" filter="url(#coinGlow)"/>

  <!-- Main coin -->
  <circle cx="32" cy="32" r="26" fill="url(#coinGold)" stroke="#b45309" stroke-width="2"/>

  <!-- Inner ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#d97706" stroke-width="1.5"/>

  <!-- Football icon -->
  <ellipse cx="32" cy="32" rx="10" ry="6" fill="#92400e" stroke="#78350f" stroke-width="1"/>
  <line x1="32" y1="26" x2="32" y2="38" stroke="#fef3c7" stroke-width="1"/>
  <path d="M28 30 Q32 28 36 30" fill="none" stroke="#fef3c7" stroke-width="0.8"/>
  <path d="M28 34 Q32 36 36 34" fill="none" stroke="#fef3c7" stroke-width="0.8"/>

  <!-- Shine highlight -->
  <ellipse cx="24" cy="24" rx="6" ry="4" fill="white" opacity="0.4" transform="rotate(-30 24 24)"/>
</svg>