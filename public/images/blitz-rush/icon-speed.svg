<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="boltOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="30%" style="stop-color:#fbbf24"/>
      <stop offset="70%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <filter id="boltGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer glow -->
  <polygon points="36,4 18,32 28,32 22,60 48,28 36,28 44,4"
           fill="#f97316" opacity="0.3" filter="url(#boltGlow)"/>

  <!-- Main lightning bolt -->
  <polygon points="35,6 20,30 29,30 24,58 46,26 35,26 42,6"
           fill="url(#boltOrange)" stroke="#c2410c" stroke-width="1.5"/>

  <!-- Inner highlight -->
  <polygon points="34,12 26,28 31,28 28,46 40,28 34,28 38,12"
           fill="#fef3c7" opacity="0.4"/>

  <!-- Speed lines -->
  <line x1="8" y1="20" x2="16" y2="20" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="6" y1="32" x2="14" y2="32" stroke="#f97316" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="8" y1="44" x2="16" y2="44" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>