<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="starPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e9d5ff"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer glow -->
  <polygon points="32,4 38,22 56,22 42,34 48,52 32,42 16,52 22,34 8,22 26,22"
           fill="#a855f7" opacity="0.3" filter="url(#starGlow)"/>

  <!-- Main star -->
  <polygon points="32,6 37,21 54,21 41,32 46,50 32,40 18,50 23,32 10,21 27,21"
           fill="url(#starPurple)" stroke="#6b21a8" stroke-width="1.5"/>

  <!-- 2X text -->
  <text x="32" y="36"
        font-family="Arial Black, Arial, sans-serif"
        font-size="16"
        font-weight="bold"
        text-anchor="middle"
        fill="white"
        stroke="#581c87"
        stroke-width="0.5">2X</text>

  <!-- Sparkles -->
  <circle cx="12" cy="12" r="2" fill="#e9d5ff" opacity="0.8"/>
  <circle cx="52" cy="10" r="1.5" fill="#c4b5fd" opacity="0.7"/>
  <circle cx="8" cy="42" r="1.5" fill="#e9d5ff" opacity="0.6"/>
  <circle cx="56" cy="44" r="2" fill="#c4b5fd" opacity="0.7"/>
</svg>