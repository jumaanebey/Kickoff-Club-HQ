<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blitz Rush 2.0</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a1628;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #game {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #game canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    /* HUD - Minimal */
    .hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }

    .hud-score {
      background: rgba(0,0,0,0.5);
      padding: 8px 16px;
      border-radius: 8px;
      color: white;
      font-size: 24px;
      font-weight: 700;
    }

    .hud-coins {
      background: rgba(0,0,0,0.5);
      padding: 8px 16px;
      border-radius: 8px;
      color: #fbbf24;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Screens - Minimal */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .screen.active { display: flex; }

    /* Start Screen */
    #start-screen {
      background: #fafafa;
    }

    .logo { font-size: 48px; margin-bottom: 8px; }

    .title {
      font-size: 32px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 14px;
      color: #666;
      margin-bottom: 40px;
    }

    .mode-label {
      font-size: 11px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .mode-buttons {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
    }

    .mode-btn {
      padding: 16px 32px;
      border: 2px solid #e5e5e5;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .mode-btn:hover { border-color: #1a1a1a; }

    .mode-btn.selected {
      border-color: #1a1a1a;
      background: #1a1a1a;
      color: white;
    }

    .mode-btn .icon { font-size: 24px; margin-bottom: 4px; }
    .mode-btn .label { font-size: 12px; font-weight: 600; }

    .play-btn {
      padding: 18px 60px;
      font-size: 16px;
      font-weight: 600;
      background: #1a1a1a;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .play-btn:hover {
      background: #333;
      transform: translateY(-2px);
    }

    /* Game Over Screen */
    #gameover-screen {
      background: rgba(0,0,0,0.9);
    }

    .gameover-title {
      font-size: 48px;
      font-weight: 700;
      color: #ef4444;
      margin-bottom: 20px;
    }

    .gameover-score {
      font-size: 32px;
      color: white;
      margin-bottom: 8px;
    }

    .gameover-yards {
      font-size: 18px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 40px;
    }

    .retry-btn {
      padding: 16px 50px;
      font-size: 18px;
      font-weight: 600;
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .menu-btn {
      padding: 12px 40px;
      font-size: 14px;
      background: transparent;
      color: rgba(255,255,255,0.7);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 12px;
      cursor: pointer;
    }

    /* Touchdown Screen */
    #touchdown-screen {
      background: rgba(0,0,0,0.9);
    }

    .td-title {
      font-size: 48px;
      font-weight: 700;
      color: #22c55e;
      margin-bottom: 10px;
    }

    .td-level {
      font-size: 18px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 20px;
    }

    .td-score {
      font-size: 32px;
      color: white;
      margin-bottom: 40px;
    }

    .next-btn {
      padding: 16px 50px;
      font-size: 18px;
      font-weight: 600;
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 12px;
    }

    /* Power-up indicators */
    .powerups {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
      pointer-events: none;
    }

    .powerup-indicator {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .powerup-indicator.active { display: flex; }
    .powerup-indicator.shield { background: #3b82f6; }
    .powerup-indicator.magnet { background: #ec4899; }
    .powerup-indicator.double { background: #a855f7; }
    .powerup-indicator.speed { background: #f97316; }
  </style>
</head>
<body>
  <div id="game">
    <!-- HUD -->
    <div class="hud" id="hud" style="display: none;">
      <div class="hud-score" id="score">0</div>
      <div class="hud-coins"><span>$</span><span id="coins">0</span></div>
    </div>

    <!-- Power-up indicators -->
    <div class="powerups" id="powerups">
      <div class="powerup-indicator shield" id="pu-shield">S</div>
      <div class="powerup-indicator magnet" id="pu-magnet">M</div>
      <div class="powerup-indicator double" id="pu-double">2x</div>
      <div class="powerup-indicator speed" id="pu-speed">!</div>
    </div>

    <!-- Start Screen -->
    <div class="screen active" id="start-screen">
      <div class="logo">🏈</div>
      <h1 class="title">Blitz Rush</h1>
      <p class="tagline">Dodge defenders. Score touchdowns.</p>

      <div class="mode-label">Game Mode</div>
      <div class="mode-buttons">
        <div class="mode-btn selected" id="btn-endless">
          <div class="icon">∞</div>
          <div class="label">Endless</div>
        </div>
        <div class="mode-btn" id="btn-challenge">
          <div class="icon">🏆</div>
          <div class="label">Challenge</div>
        </div>
      </div>

      <button class="play-btn" id="btn-play">Start Game</button>
    </div>

    <!-- Game Over Screen -->
    <div class="screen" id="gameover-screen">
      <div class="gameover-title">TACKLED!</div>
      <div class="gameover-score" id="final-score">Score: 0</div>
      <div class="gameover-yards" id="final-yards">0 yards</div>
      <button class="retry-btn" id="btn-retry">Play Again</button>
      <button class="menu-btn" id="btn-menu">Menu</button>
    </div>

    <!-- Touchdown Screen -->
    <div class="screen" id="touchdown-screen">
      <div class="td-title">TOUCHDOWN!</div>
      <div class="td-level" id="td-level">Level 1 Complete</div>
      <div class="td-score" id="td-score">Score: 0</div>
      <button class="next-btn" id="btn-next">Next Level</button>
      <button class="menu-btn" id="btn-td-menu">Menu</button>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ==================== CONFIG ====================
    const CONFIG = {
      lanes: [-2.5, 0, 2.5],
      laneWidth: 2.5,
      playerSpeed: 0.15,
      swipeThreshold: 20,
      laneSwitchSpeed: 0.15,
      spawnDistance: 50,
      despawnDistance: 10,
      obstacleInterval: 30,
      coinInterval: 15,
      powerupChance: 0.1,
      challengeLevels: [
        { name: 'Pee Wee', distance: 100 },
        { name: 'Junior Varsity', distance: 150 },
        { name: 'Varsity', distance: 200 },
        { name: 'College', distance: 250 },
        { name: 'Pro', distance: 300 },
        { name: 'All-Star', distance: 350 },
        { name: 'Pro Bowl', distance: 400 },
        { name: 'Playoffs', distance: 450 },
        { name: 'Championship', distance: 500 },
        { name: 'Super Bowl', distance: 600 }
      ]
    };

    // ==================== GAME STATE ====================
    const state = {
      mode: 'endless',
      playing: false,
      gameOver: false,
      score: 0,
      coins: 0,
      yards: 0,
      currentLane: 1,
      targetLane: 1,
      laneProgress: 0,
      isJumping: false,
      jumpHeight: 0,
      jumpVelocity: 0,
      isRolling: false,
      rollTimer: 0,
      challengeLevel: 1,
      // Power-ups
      shielded: false,
      shieldTimer: 0,
      magnetized: false,
      magnetTimer: 0,
      doublePoints: false,
      doubleTimer: 0,
      speedBoost: false,
      speedTimer: 0
    };

    // ==================== THREE.JS SETUP ====================
    const container = document.getElementById('game');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a5f3c);
    scene.fog = new THREE.Fog(0x1a5f3c, 20, 60);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 6, 8);
    camera.lookAt(0, 0, -10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.insertBefore(renderer.domElement, container.firstChild);

    // Lighting
    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);
    const directional = new THREE.DirectionalLight(0xffffff, 0.8);
    directional.position.set(5, 10, 5);
    scene.add(directional);

    // ==================== FIELD ====================
    const fieldGeo = new THREE.PlaneGeometry(20, 200);
    const fieldMat = new THREE.MeshStandardMaterial({
      color: 0x2d8f4e,
      roughness: 0.8
    });
    const field = new THREE.Mesh(fieldGeo, fieldMat);
    field.rotation.x = -Math.PI / 2;
    field.position.z = -80;
    scene.add(field);

    // Yard lines
    for (let i = 0; i < 20; i++) {
      const lineGeo = new THREE.PlaneGeometry(18, 0.15);
      const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const line = new THREE.Mesh(lineGeo, lineMat);
      line.rotation.x = -Math.PI / 2;
      line.position.set(0, 0.01, -i * 10);
      scene.add(line);
    }

    // ==================== PLAYER ====================
    const playerGroup = new THREE.Group();

    // Body
    const bodyGeo = new THREE.CapsuleGeometry(0.4, 0.8, 8, 16);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff6b00 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1;
    playerGroup.add(body);

    // Head/Helmet
    const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
    const headMat = new THREE.MeshStandardMaterial({ color: 0x1a1a5f });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 1.8;
    playerGroup.add(head);

    // Visor
    const visorGeo = new THREE.BoxGeometry(0.5, 0.15, 0.2);
    const visorMat = new THREE.MeshStandardMaterial({ color: 0xffd700 });
    const visor = new THREE.Mesh(visorGeo, visorMat);
    visor.position.set(0, 1.75, 0.3);
    playerGroup.add(visor);

    playerGroup.position.set(0, 0, 0);
    scene.add(playerGroup);

    // ==================== OBSTACLES & COLLECTIBLES ====================
    const obstacles = [];
    const coins = [];
    const powerups = [];
    let lastObstacleZ = -CONFIG.spawnDistance;
    let lastCoinZ = -CONFIG.spawnDistance;

    function createDefender() {
      const group = new THREE.Group();

      const bodyGeo = new THREE.CapsuleGeometry(0.5, 1, 8, 16);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xcc0000 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 1.2;
      group.add(body);

      const headGeo = new THREE.SphereGeometry(0.4, 16, 16);
      const headMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 2.2;
      group.add(head);

      return group;
    }

    function createCoin() {
      const geo = new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16);
      const mat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
      const coin = new THREE.Mesh(geo, mat);
      coin.rotation.z = Math.PI / 2;
      return coin;
    }

    function createPowerup(type) {
      const colors = {
        shield: 0x3b82f6,
        magnet: 0xec4899,
        double: 0xa855f7,
        speed: 0xf97316
      };
      const geo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
      const mat = new THREE.MeshStandardMaterial({
        color: colors[type],
        emissive: colors[type],
        emissiveIntensity: 0.3
      });
      const powerup = new THREE.Mesh(geo, mat);
      powerup.userData.type = type;
      return powerup;
    }

    function spawnObstacle() {
      const lane = Math.floor(Math.random() * 3);
      const defender = createDefender();
      defender.position.set(CONFIG.lanes[lane], 0, lastObstacleZ - CONFIG.obstacleInterval);
      scene.add(defender);
      obstacles.push(defender);
      lastObstacleZ = defender.position.z;
    }

    function spawnCoin() {
      const lane = Math.floor(Math.random() * 3);
      const coin = createCoin();
      coin.position.set(CONFIG.lanes[lane], 1.2, lastCoinZ - CONFIG.coinInterval);
      scene.add(coin);
      coins.push(coin);
      lastCoinZ = coin.position.z;

      // Maybe spawn powerup instead
      if (Math.random() < CONFIG.powerupChance) {
        const types = ['shield', 'magnet', 'double', 'speed'];
        const type = types[Math.floor(Math.random() * types.length)];
        const powerup = createPowerup(type);
        const pLane = Math.floor(Math.random() * 3);
        powerup.position.set(CONFIG.lanes[pLane], 1.2, coin.position.z - 5);
        scene.add(powerup);
        powerups.push(powerup);
      }
    }

    // ==================== CONTROLS ====================
    let touchStartX = 0;
    let touchStartY = 0;
    let swiped = false;

    function switchLane(dir) {
      if (!state.playing || state.gameOver) return;
      const newLane = state.targetLane + dir;
      if (newLane >= 0 && newLane <= 2) {
        state.targetLane = newLane;
      }
    }

    function jump() {
      if (!state.playing || state.gameOver) return;
      if (!state.isJumping && !state.isRolling && state.jumpHeight === 0) {
        state.isJumping = true;
        state.jumpVelocity = 0.25;
      }
    }

    function roll() {
      if (!state.playing || state.gameOver) return;
      if (!state.isRolling && !state.isJumping && state.jumpHeight === 0) {
        state.isRolling = true;
        state.rollTimer = 0.5;
      }
    }

    // Touch controls
    document.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      swiped = false;
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (swiped || !state.playing) return;

      const dx = e.touches[0].clientX - touchStartX;
      const dy = e.touches[0].clientY - touchStartY;

      if (Math.abs(dx) > CONFIG.swipeThreshold && Math.abs(dx) > Math.abs(dy)) {
        switchLane(dx > 0 ? 1 : -1);
        swiped = true;
      } else if (Math.abs(dy) > CONFIG.swipeThreshold && Math.abs(dy) > Math.abs(dx)) {
        if (dy < 0) jump();
        else roll();
        swiped = true;
      }
    }, { passive: true });

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      if (!state.playing) return;
      switch (e.code) {
        case 'ArrowLeft':
        case 'KeyA':
          switchLane(-1);
          break;
        case 'ArrowRight':
        case 'KeyD':
          switchLane(1);
          break;
        case 'ArrowUp':
        case 'KeyW':
        case 'Space':
          jump();
          break;
        case 'ArrowDown':
        case 'KeyS':
          roll();
          break;
      }
    });

    // ==================== UI ====================
    const startScreen = document.getElementById('start-screen');
    const gameoverScreen = document.getElementById('gameover-screen');
    const touchdownScreen = document.getElementById('touchdown-screen');
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');
    const coinsEl = document.getElementById('coins');

    const btnEndless = document.getElementById('btn-endless');
    const btnChallenge = document.getElementById('btn-challenge');
    const btnPlay = document.getElementById('btn-play');
    const btnRetry = document.getElementById('btn-retry');
    const btnMenu = document.getElementById('btn-menu');
    const btnNext = document.getElementById('btn-next');
    const btnTdMenu = document.getElementById('btn-td-menu');

    btnEndless.addEventListener('click', () => {
      state.mode = 'endless';
      btnEndless.classList.add('selected');
      btnChallenge.classList.remove('selected');
    });

    btnChallenge.addEventListener('click', () => {
      state.mode = 'challenge';
      btnChallenge.classList.add('selected');
      btnEndless.classList.remove('selected');
    });

    btnPlay.addEventListener('click', startGame);
    btnRetry.addEventListener('click', startGame);
    btnMenu.addEventListener('click', showMenu);
    btnNext.addEventListener('click', nextLevel);
    btnTdMenu.addEventListener('click', showMenu);

    function showScreen(screen) {
      startScreen.classList.remove('active');
      gameoverScreen.classList.remove('active');
      touchdownScreen.classList.remove('active');
      if (screen) screen.classList.add('active');
    }

    function showMenu() {
      state.playing = false;
      state.gameOver = false;
      hud.style.display = 'none';
      showScreen(startScreen);
    }

    function startGame() {
      // Reset state
      state.playing = true;
      state.gameOver = false;
      state.score = 0;
      state.coins = 0;
      state.yards = 0;
      state.currentLane = 1;
      state.targetLane = 1;
      state.laneProgress = 0;
      state.isJumping = false;
      state.jumpHeight = 0;
      state.jumpVelocity = 0;
      state.isRolling = false;
      state.rollTimer = 0;
      state.shielded = false;
      state.magnetized = false;
      state.doublePoints = false;
      state.speedBoost = false;

      // Clear objects
      obstacles.forEach(o => scene.remove(o));
      coins.forEach(c => scene.remove(c));
      powerups.forEach(p => scene.remove(p));
      obstacles.length = 0;
      coins.length = 0;
      powerups.length = 0;
      lastObstacleZ = -CONFIG.spawnDistance;
      lastCoinZ = -CONFIG.spawnDistance;

      // Reset player
      playerGroup.position.set(0, 0, 0);
      playerGroup.rotation.set(0, 0, 0);
      playerGroup.scale.set(1, 1, 1);

      // Reset camera
      camera.position.set(0, 6, 8);

      // Spawn initial objects
      for (let i = 0; i < 5; i++) spawnObstacle();
      for (let i = 0; i < 10; i++) spawnCoin();

      // UI
      hud.style.display = 'flex';
      showScreen(null);
      updateHUD();
    }

    function endGame() {
      state.playing = false;
      state.gameOver = true;
      hud.style.display = 'none';

      document.getElementById('final-score').textContent = `Score: ${Math.floor(state.score)}`;
      document.getElementById('final-yards').textContent = `${Math.floor(state.yards)} yards`;
      showScreen(gameoverScreen);
    }

    function touchdown() {
      state.playing = false;
      hud.style.display = 'none';

      const level = CONFIG.challengeLevels[state.challengeLevel - 1];
      document.getElementById('td-level').textContent = `${level.name} Complete!`;
      document.getElementById('td-score').textContent = `Score: ${Math.floor(state.score)}`;

      if (state.challengeLevel >= 10) {
        document.getElementById('btn-next').textContent = 'Play Again';
      } else {
        document.getElementById('btn-next').textContent = 'Next Level';
      }

      showScreen(touchdownScreen);
    }

    function nextLevel() {
      if (state.challengeLevel >= 10) {
        state.challengeLevel = 1;
      } else {
        state.challengeLevel++;
      }
      startGame();
    }

    function updateHUD() {
      scoreEl.textContent = Math.floor(state.score);
      coinsEl.textContent = state.coins;

      // Power-up indicators
      document.getElementById('pu-shield').classList.toggle('active', state.shielded);
      document.getElementById('pu-magnet').classList.toggle('active', state.magnetized);
      document.getElementById('pu-double').classList.toggle('active', state.doublePoints);
      document.getElementById('pu-speed').classList.toggle('active', state.speedBoost);
    }

    // ==================== GAME LOOP ====================
    let lastTime = 0;

    function gameLoop(time) {
      requestAnimationFrame(gameLoop);

      const dt = Math.min((time - lastTime) / 1000, 0.1);
      lastTime = time;

      if (!state.playing || state.gameOver) {
        renderer.render(scene, camera);
        return;
      }

      // Speed (with boost)
      const speed = CONFIG.playerSpeed * (state.speedBoost ? 1.5 : 1);

      // Move player forward
      state.yards += speed;
      state.score += speed * (state.doublePoints ? 2 : 1);

      // Lane switching - instant snap like Subway Surfers
      const targetX = CONFIG.lanes[state.targetLane];
      const dx = targetX - playerGroup.position.x;
      if (Math.abs(dx) > 0.1) {
        playerGroup.position.x += dx * CONFIG.laneSwitchSpeed * 60 * dt;
      } else {
        playerGroup.position.x = targetX;
        state.currentLane = state.targetLane;
      }

      // Jump
      if (state.isJumping || state.jumpHeight > 0) {
        state.jumpHeight += state.jumpVelocity;
        state.jumpVelocity -= 0.015;
        if (state.jumpHeight <= 0) {
          state.jumpHeight = 0;
          state.jumpVelocity = 0;
          state.isJumping = false;
        }
        playerGroup.position.y = state.jumpHeight;
      }

      // Roll
      if (state.isRolling) {
        state.rollTimer -= dt;
        playerGroup.rotation.x = Math.PI / 3;
        playerGroup.scale.y = 0.5;
        playerGroup.position.y = -0.3;
        if (state.rollTimer <= 0) {
          state.isRolling = false;
          playerGroup.rotation.x = 0;
          playerGroup.scale.y = 1;
          playerGroup.position.y = 0;
        }
      }

      // Power-up timers
      if (state.shielded) {
        state.shieldTimer -= dt;
        if (state.shieldTimer <= 0) state.shielded = false;
      }
      if (state.magnetized) {
        state.magnetTimer -= dt;
        if (state.magnetTimer <= 0) state.magnetized = false;
      }
      if (state.doublePoints) {
        state.doubleTimer -= dt;
        if (state.doubleTimer <= 0) state.doublePoints = false;
      }
      if (state.speedBoost) {
        state.speedTimer -= dt;
        if (state.speedTimer <= 0) state.speedBoost = false;
      }

      // Move world (player stays at z=0, world moves toward player)
      const moveAmount = speed;

      // Move obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.position.z += moveAmount;

        // Collision check
        if (Math.abs(obs.position.x - playerGroup.position.x) < 1 &&
            Math.abs(obs.position.z) < 1 &&
            state.jumpHeight < 1.5 && !state.isRolling) {
          if (state.shielded) {
            // Pass through with shield
            scene.remove(obs);
            obstacles.splice(i, 1);
          } else {
            endGame();
            return;
          }
        }

        // Despawn
        if (obs.position.z > CONFIG.despawnDistance) {
          scene.remove(obs);
          obstacles.splice(i, 1);
        }
      }

      // Spawn new obstacles
      if (-lastObstacleZ < state.yards + CONFIG.spawnDistance) {
        spawnObstacle();
      }

      // Move and collect coins
      for (let i = coins.length - 1; i >= 0; i--) {
        const coin = coins[i];
        coin.position.z += moveAmount;
        coin.rotation.y += dt * 3;

        // Magnet attraction
        if (state.magnetized) {
          const dx = playerGroup.position.x - coin.position.x;
          const dz = -coin.position.z;
          if (Math.sqrt(dx*dx + dz*dz) < 8) {
            coin.position.x += dx * 0.1;
            coin.position.z += dz * 0.05;
          }
        }

        // Collection
        if (Math.abs(coin.position.x - playerGroup.position.x) < 1 &&
            Math.abs(coin.position.z) < 1) {
          state.coins++;
          scene.remove(coin);
          coins.splice(i, 1);
          continue;
        }

        // Despawn
        if (coin.position.z > CONFIG.despawnDistance) {
          scene.remove(coin);
          coins.splice(i, 1);
        }
      }

      // Spawn new coins
      if (-lastCoinZ < state.yards + CONFIG.spawnDistance) {
        spawnCoin();
      }

      // Move and collect powerups
      for (let i = powerups.length - 1; i >= 0; i--) {
        const pu = powerups[i];
        pu.position.z += moveAmount;
        pu.rotation.y += dt * 2;
        pu.rotation.x += dt;

        // Collection
        if (Math.abs(pu.position.x - playerGroup.position.x) < 1 &&
            Math.abs(pu.position.z) < 1.5) {
          activatePowerup(pu.userData.type);
          scene.remove(pu);
          powerups.splice(i, 1);
          continue;
        }

        // Despawn
        if (pu.position.z > CONFIG.despawnDistance) {
          scene.remove(pu);
          powerups.splice(i, 1);
        }
      }

      // Move field
      field.position.z += moveAmount;
      if (field.position.z > 0) field.position.z -= 200;

      // Challenge mode - touchdown check
      if (state.mode === 'challenge') {
        const level = CONFIG.challengeLevels[state.challengeLevel - 1];
        if (state.yards >= level.distance) {
          touchdown();
          return;
        }
      }

      updateHUD();
      renderer.render(scene, camera);
    }

    function activatePowerup(type) {
      const duration = 5;
      switch (type) {
        case 'shield':
          state.shielded = true;
          state.shieldTimer = duration;
          break;
        case 'magnet':
          state.magnetized = true;
          state.magnetTimer = duration;
          break;
        case 'double':
          state.doublePoints = true;
          state.doubleTimer = duration;
          break;
        case 'speed':
          state.speedBoost = true;
          state.speedTimer = duration;
          break;
      }
    }

    // ==================== RESIZE ====================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ==================== START ====================
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
