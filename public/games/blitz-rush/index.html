<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Blitz Rush - Endless Football Runner</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      font-family: 'Inter', sans-serif;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }
    #game-container canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* HUD */
    .hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
      z-index: 10;
      pointer-events: none;
    }

    .hud-left {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hud-score {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0,0,0,0.5);
      padding: 10px 18px;
      border-radius: 14px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .hud-score-label {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hud-score-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: white;
      letter-spacing: 2px;
    }

    .hud-combo {
      display: none;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(249,115,22,0.9), rgba(234,88,12,0.9));
      padding: 8px 16px;
      border-radius: 20px;
      animation: comboPulse 0.3s ease-out;
    }

    .hud-combo.active { display: flex; }

    @keyframes comboPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .hud-combo-text {
      font-size: 13px;
      font-weight: 700;
      color: white;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hud-right {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
    }

    .hud-coins {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.5);
      padding: 8px 14px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .hud-coins-icon { font-size: 18px; }

    .hud-coins-value {
      font-size: 18px;
      font-weight: 700;
      color: #fbbf24;
    }

    .hud-yards {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      background: rgba(0,0,0,0.4);
      padding: 6px 12px;
      border-radius: 8px;
    }

    .hud-speed {
      width: 100px;
      height: 6px;
      background: rgba(255,255,255,0.15);
      border-radius: 3px;
      overflow: hidden;
    }

    .hud-speed-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      border-radius: 3px;
      transition: width 0.2s;
    }

    .hud-danger {
      display: none;
      align-items: center;
      gap: 6px;
      background: rgba(239,68,68,0.9);
      padding: 6px 12px;
      border-radius: 20px;
      animation: dangerPulse 0.4s ease-in-out infinite alternate;
    }

    .hud-danger.active { display: flex; }

    @keyframes dangerPulse {
      0% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    .hud-danger-text {
      font-size: 12px;
      font-weight: 700;
      color: white;
      text-transform: uppercase;
    }

    /* Announcements */
    .announcement {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 64px;
      color: white;
      text-shadow: 0 4px 20px rgba(0,0,0,0.5);
      pointer-events: none;
      z-index: 100;
      white-space: nowrap;
      letter-spacing: 4px;
    }

    .announcement.show {
      animation: announceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes announceIn {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }

    /* Start Screen - Minimalist Design */
    .start-screen {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .start-screen.hidden { display: none; }
    .start-container {
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .start-logo {
      font-size: 48px;
      margin-bottom: 8px;
    }
    .start-title {
      font-size: 32px;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: -1px;
      margin-bottom: 8px;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
    }
    .start-tagline {
      font-size: 14px;
      color: #666;
      margin-bottom: 48px;
    }
    .mode-section {
      margin-bottom: 32px;
    }
    .mode-label {
      font-size: 11px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    .mode-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .mode-btn {
      flex: 1;
      padding: 16px 24px;
      border: 2px solid #e5e5e5;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .mode-btn:hover {
      border-color: #1a1a1a;
    }
    .mode-btn.selected {
      border-color: #1a1a1a;
      background: #1a1a1a;
      color: white;
    }
    .mode-btn .icon {
      font-size: 24px;
      margin-bottom: 4px;
    }
    .mode-btn .label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .play-btn {
      width: 100%;
      padding: 18px 40px;
      font-size: 16px;
      font-weight: 600;
      background: #1a1a1a;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
    }
    .play-btn:hover {
      background: #333;
      transform: translateY(-2px);
    }
    .start-controls {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 24px;
      color: #999;
      font-size: 12px;
    }
    .start-controls span {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .start-controls kbd {
      background: #e5e5e5;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-family: monospace;
      color: #666;
    }

    /* Game Over Screen */
    .game-over {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .game-over.show { display: flex; }
    .game-over-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 64px;
      color: #ef4444;
      letter-spacing: 4px;
      margin-bottom: 20px;
    }
    .game-over-score {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      color: white;
      margin-bottom: 10px;
    }
    .game-over-yards {
      font-size: 20px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 40px;
    }
    .retry-button {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 3px;
      padding: 16px 50px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 6px 25px rgba(34,197,94,0.4);
    }

    /* Touchdown Celebration */
    .td-celebration {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(34,197,94,0.95), rgba(22,163,74,0.95));
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1001;
      animation: tdFadeIn 0.3s ease-out;
    }
    .td-celebration.show { display: flex; }
    @keyframes tdFadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    .td-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 80px;
      color: white;
      letter-spacing: 6px;
      margin-bottom: 10px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
      animation: tdBounce 0.5s ease-out;
    }
    @keyframes tdBounce {
      0% { transform: scale(0); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    .td-level {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: rgba(255,255,255,0.9);
      letter-spacing: 3px;
      margin-bottom: 30px;
    }
    .td-stats {
      display: flex;
      gap: 40px;
      margin-bottom: 40px;
    }
    .td-stat {
      text-align: center;
    }
    .td-stat-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      color: white;
    }
    .td-stat-label {
      font-size: 14px;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .td-next-btn {
      background: white;
      color: #16a34a;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 3px;
      padding: 16px 50px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 6px 25px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }
    .td-next-btn:hover { transform: translateY(-3px); }
    .td-complete-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 64px;
      color: #fbbf24;
      letter-spacing: 4px;
      margin-bottom: 20px;
    }

    /* Challenge level indicator */
    .hud-level {
      font-size: 12px;
      font-weight: 700;
      color: #fbbf24;
      background: rgba(0,0,0,0.5);
      padding: 6px 12px;
      border-radius: 8px;
      display: none;
    }
    .hud-level.show { display: block; }

    /* Screen Flash Effect */
    .screen-flash {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 50;
      opacity: 0;
      transition: opacity 0.1s ease-out;
    }

    /* Mobile Touch Controls */
    .mobile-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50%;
      display: none;
      z-index: 20;
      pointer-events: none;
    }
    @media (max-width: 768px), (pointer: coarse) {
      .mobile-controls { display: flex; }
    }
    .touch-zone {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
    }
    .touch-zone:active {
      background: rgba(255,255,255,0.1);
    }
    .touch-zone-icon {
      font-size: 32px;
      opacity: 0.3;
      pointer-events: none;
    }
    .touch-left { border-right: 1px solid rgba(255,255,255,0.1); }
    .touch-right { border-left: 1px solid rgba(255,255,255,0.1); }
    .touch-jump {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.3);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 25;
      -webkit-tap-highlight-color: transparent;
    }
    @media (max-width: 768px), (pointer: coarse) {
      .touch-jump { display: flex; }
    }
    .touch-jump:active {
      background: rgba(255,255,255,0.3);
      transform: scale(0.95);
    }
    .touch-jump-icon {
      font-size: 28px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="hud-overlay">
      <div class="hud-left">
        <div class="hud-score">
          <div>
            <div class="hud-score-label">Score</div>
            <div class="hud-score-value" id="score">0</div>
          </div>
        </div>
        <div class="hud-combo" id="combo">
          <span class="hud-combo-text" id="combo-val">x2</span>
          <span class="hud-combo-text">COMBO</span>
        </div>
      </div>
      <div class="hud-right">
        <div class="hud-coins">
          <span class="hud-coins-icon">🪙</span>
          <span class="hud-coins-value" id="coins">0</span>
        </div>
        <div class="hud-yards" id="yards">0 YDS</div>
        <div class="hud-yards" id="touchdowns" style="display: none; color: #22c55e;">0 TDs</div>
        <div class="hud-level" id="hud-level">LEVEL 1</div>
        <div class="hud-speed">
          <div class="hud-speed-fill" id="speed" style="width: 60%"></div>
        </div>
        <div class="hud-danger" id="danger">
          <span>⚠️</span>
          <span class="hud-danger-text">Danger!</span>
        </div>
      </div>
    </div>
    <div class="announcement" id="announcement"></div>
    <div class="screen-flash" id="screen-flash"></div>
    <div class="mobile-controls">
      <div class="touch-zone touch-left" id="touch-left">
        <span class="touch-zone-icon">←</span>
      </div>
      <div class="touch-zone touch-right" id="touch-right">
        <span class="touch-zone-icon">→</span>
      </div>
    </div>
    <div class="touch-jump" id="touch-jump">
      <span class="touch-jump-icon">↑</span>
    </div>
    <div class="start-screen" id="start-screen">
      <div class="start-container">
        <div class="start-logo">🏈</div>
        <h1 class="start-title">Blitz Rush</h1>
        <p class="start-tagline">Dodge defenders. Score touchdowns.</p>

        <div class="mode-section">
          <div class="mode-label">Game Mode</div>
          <div class="mode-buttons">
            <div class="mode-btn selected" id="endless-btn" data-mode="endless">
              <div class="icon">♾️</div>
              <div class="label">Endless</div>
            </div>
            <div class="mode-btn" id="challenge-btn" data-mode="challenge">
              <div class="icon">🏆</div>
              <div class="label">Challenge</div>
            </div>
          </div>
        </div>

        <button class="play-btn" id="play-button">Start Game</button>

        <div class="start-controls">
          <span><kbd>←</kbd><kbd>→</kbd> Move</span>
          <span><kbd>Space</kbd> Jump</span>
        </div>
      </div>
    </div>
    <div class="game-over" id="game-over">
      <div class="game-over-title">TACKLED!</div>
      <div class="game-over-score" id="final-score">SCORE: 0</div>
      <div class="game-over-yards" id="final-yards">0 YARDS</div>
      <button class="retry-button" id="retry-button">PLAY AGAIN</button>
    </div>
    <div class="td-celebration" id="td-celebration">
      <div class="td-title" id="td-title">TOUCHDOWN!</div>
      <div class="td-level" id="td-level-text">LEVEL 1 COMPLETE</div>
      <div class="td-stats">
        <div class="td-stat">
          <div class="td-stat-value" id="td-score">0</div>
          <div class="td-stat-label">Score</div>
        </div>
        <div class="td-stat">
          <div class="td-stat-value" id="td-coins">0</div>
          <div class="td-stat-label">Coins</div>
        </div>
      </div>
      <button class="td-next-btn" id="td-next-btn">NEXT LEVEL</button>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // Theme 1: Classic NFL
    const theme = {
      name: 'Classic NFL',
      sky: [0x1e3a5f, 0x87ceeb],
      field: 0x15803d,
      fieldDark: 0x166534,
      endZone: 0xf97316,
      lines: 0xffffff,
      player: 0xf97316,
      playerHelmet: 0xfbbf24,
      playerPants: 0xffffff,
      defender: 0xdc2626,
      defenderHelmet: 0x1e293b,
      defenderPants: 0xffffff,
      obstacle: 0xf97316,
      coin: 0xfbbf24,
      crowd: [0x374151, 0xef4444, 0x3b82f6, 0xfbbf24, 0x22c55e],
      ambient: 0xffffff,
      ambientIntensity: 0.7,
      directional: 0xffffff,
      directionalIntensity: 1.0,
      bloom: { strength: 0.4, radius: 0.5, threshold: 0.75 }
    };

    const container = document.getElementById('game-container');
    const cameraModes = ['Broadcast', 'Chase Cam', 'Cinematic', 'Top Down'];

    // Lane system - wider lanes for more defined movement
    const lanes = [-5, 0, 5];
    const laneCount = lanes.length;

    // Challenge level configurations (10 levels, each harder)
    const challengeLevels = [
      { level: 1, fieldLength: 200, speed: 1.0, defenders: 4, obstacleSpacing: 15, name: 'PEE WEE' },
      { level: 2, fieldLength: 240, speed: 1.1, defenders: 5, obstacleSpacing: 14, name: 'POP WARNER' },
      { level: 3, fieldLength: 280, speed: 1.2, defenders: 6, obstacleSpacing: 13, name: 'MIDDLE SCHOOL' },
      { level: 4, fieldLength: 320, speed: 1.95, defenders: 7, obstacleSpacing: 12, name: 'JV' },
      { level: 5, fieldLength: 360, speed: 2.1, defenders: 8, obstacleSpacing: 11, name: 'VARSITY' },
      { level: 6, fieldLength: 400, speed: 2.25, defenders: 9, obstacleSpacing: 10, name: 'COLLEGE' },
      { level: 7, fieldLength: 440, speed: 2.4, defenders: 10, obstacleSpacing: 9, name: 'NFL ROOKIE' },
      { level: 8, fieldLength: 500, speed: 2.55, defenders: 11, obstacleSpacing: 8, name: 'PRO BOWL' },
      { level: 9, fieldLength: 560, speed: 2.7, defenders: 12, obstacleSpacing: 7, name: 'PLAYOFFS' },
      { level: 10, fieldLength: 600, speed: 3.0, defenders: 14, obstacleSpacing: 6, name: 'SUPER BOWL' },
    ];

    // Game state
    const state = {
      gameStarted: false, gameOver: false, celebrating: false,
      gameMode: 'endless', // 'endless' or 'challenge'
      challengeLevel: 1, // Current challenge level (1-10)
      fieldLength: 100, // Yards to touchdown
      touchdowns: 0,
      score: 0, coins: 0, speed: 0.8, playerZ: 10, playerX: 0,
      currentLane: 1, targetLane: 1,
      laneSwitching: false, laneSwitchDir: 0,
      switchTime: 0, switchStartX: 0, switchEndX: 0, switchHop: 0,
      yards: 0, yardsInDrive: 0, combo: 0, comboTimer: 0, lastCoinTime: 0,
      lastMilestone: 0,
      tackleRecovery: 0,
      slowMo: false, slowMoTimer: 0,
      screenShake: 0, cameraMode: 0,
      nearMissTimer: 0,
      // Power-ups
      shielded: false, shieldTimer: 0,      // Untackleable
      boosting: false, boostTimer: 0,       // Speed boost
      magnetized: false, magnetTimer: 0,    // Coin magnet
      isJumping: false, jumpHeight: 0, jumpVelocity: 0
    };

    // Get lanes blocked at a specific Z position (for smart spawning)
    function getBlockedLanes(z, range = 8) {
      const blocked = [false, false, false];
      obstacles.forEach(obs => {
        if (Math.abs(obs.position.z - z) < range) {
          const laneIdx = lanes.findIndex(lx => Math.abs(lx - obs.position.x) < 2);
          if (laneIdx >= 0) blocked[laneIdx] = true;
        }
      });
      defenders.forEach(def => {
        if (Math.abs(def.position.z - z) < range) {
          const laneIdx = lanes.findIndex(lx => Math.abs(lx - def.position.x) < 2);
          if (laneIdx >= 0) blocked[laneIdx] = true;
        }
      });
      return blocked;
    }

    // Get a safe lane that isn't blocked
    function getSafeLane(z) {
      const blocked = getBlockedLanes(z);
      const openLanes = [];
      blocked.forEach((b, i) => { if (!b) openLanes.push(i); });
      if (openLanes.length === 0) return Math.floor(Math.random() * 3); // Fallback
      return openLanes[Math.floor(Math.random() * openLanes.length)];
    }

    // ========== SOUND SYSTEM (Web Audio API) ==========
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      if (type === 'coin') {
        // Bright coin collect sound
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1760, now + 0.1);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      }
      else if (type === 'jump') {
        // Whoosh jump sound
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      }
      else if (type === 'swipe') {
        // Quick swipe sound
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      }
      else if (type === 'juke') {
        // Success juke sound
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523, now);
        osc.frequency.setValueAtTime(659, now + 0.08);
        osc.frequency.setValueAtTime(784, now + 0.16);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      }
      else if (type === 'tackle') {
        // Impact tackle sound
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const noise = audioCtx.createOscillator();
        const noiseGain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        noise.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        noise.type = 'square';
        noise.frequency.setValueAtTime(80, now);
        noiseGain.gain.setValueAtTime(0.1, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.3);
        noise.start(now);
        noise.stop(now + 0.2);
      }
      else if (type === 'touchdown') {
        // Victory touchdown fanfare
        const notes = [523, 659, 784, 1047];
        notes.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.1);
          gain.gain.setValueAtTime(0.15, now + i * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);
          osc.start(now + i * 0.1);
          osc.stop(now + i * 0.1 + 0.3);
        });
      }
      else if (type === 'milestone') {
        // Milestone chime
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(660, now);
        osc.frequency.setValueAtTime(880, now + 0.1);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      }
      else if (type === 'powerup') {
        // Power-up collect - ascending sparkle
        const notes = [440, 554, 659, 880];
        notes.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.06);
          gain.gain.setValueAtTime(0.12, now + i * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.06 + 0.15);
          osc.start(now + i * 0.06);
          osc.stop(now + i * 0.06 + 0.15);
        });
      }
    }

    // ========== SCREEN FLASH EFFECT ==========
    function flashScreen(color, duration = 150) {
      const flash = document.getElementById('screen-flash');
      flash.style.background = color;
      flash.style.opacity = '0.3';
      setTimeout(() => { flash.style.opacity = '0'; }, duration);
    }

    // Player input
    let inputQueue = [];
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    // Start game with mode selection
    function startGame(mode = 'endless', level = 1) {
      // Initialize audio on first user interaction
      initAudio();

      state.gameStarted = true;
      state.gameOver = false;
      state.celebrating = false;
      state.gameMode = mode;
      state.challengeLevel = level;
      state.touchdowns = 0;
      state.score = 0;
      state.coins = 0;
      state.yards = 0;
      state.yardsInDrive = 0;
      state.lastMilestone = 0;
      state.currentLane = 1;
      state.targetLane = 1;
      state.playerZ = 10;
      state.playerX = lanes[1];
      state.jumpHeight = 0;
      state.isJumping = false;

      // Set speed and field length based on mode
      if (mode === 'challenge') {
        const levelConfig = challengeLevels[level - 1];
        state.fieldLength = levelConfig.fieldLength;
        state.speed = levelConfig.speed;
      } else {
        // Endless mode - easier, more relaxed
        state.fieldLength = 0; // No end
        state.speed = 0.7; // Slower than challenge
      }

      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('game-over').classList.remove('show');
      document.getElementById('td-celebration').classList.remove('show');

      // Update HUD for mode
      if (mode === 'challenge') {
        const levelConfig = challengeLevels[level - 1];
        document.getElementById('yards').textContent = `0 / ${levelConfig.fieldLength} YDS`;
        document.getElementById('touchdowns').style.display = 'block';
        document.getElementById('touchdowns').textContent = '0 TDs';
        document.getElementById('hud-level').classList.add('show');
        document.getElementById('hud-level').textContent = `LEVEL ${level}: ${levelConfig.name}`;
      } else {
        document.getElementById('touchdowns').style.display = 'none';
        document.getElementById('hud-level').classList.remove('show');
      }

      // Reset player position
      player.position.set(lanes[1], 0, 10);

      // Reset obstacles and defenders
      resetObstaclesAndDefenders();
    }

    // Reset obstacles and defenders for new game/level
    function resetObstaclesAndDefenders() {
      obstacles.forEach((obs, idx) => {
        obs.position.z = -10 - idx * 12;
        obs.position.x = lanes[Math.floor(Math.random() * 3)];
        obs.userData.passed = false;
        obs.userData.cleared = false;
        obs.userData.knocked = false;
        obs.rotation.set(0, 0, 0);
      });

      defenders.forEach((def, idx) => {
        def.position.z = -5 - idx * 8;
        def.userData.assignedLane = Math.floor(Math.random() * laneCount);
        def.position.x = lanes[def.userData.assignedLane];
      });
    }

    // Show touchdown celebration
    function showTouchdownCelebration() {
      state.celebrating = true;
      const levelConfig = challengeLevels[state.challengeLevel - 1];

      playSound('touchdown');
      flashScreen('#22c55e', 400);
      spawnConfetti(player.position.x, player.position.z);
      crowdPeople.forEach(p => { p.userData.jumping = true; });

      // Update celebration overlay
      document.getElementById('td-score').textContent = Math.floor(state.score).toLocaleString();
      document.getElementById('td-coins').textContent = state.coins;

      if (state.challengeLevel >= 10) {
        // Game complete!
        document.getElementById('td-title').textContent = '🏆 CHAMPION! 🏆';
        document.getElementById('td-level-text').textContent = 'ALL 10 LEVELS COMPLETE!';
        document.getElementById('td-next-btn').textContent = 'PLAY AGAIN';
      } else {
        document.getElementById('td-title').textContent = 'TOUCHDOWN!';
        document.getElementById('td-level-text').textContent = `LEVEL ${state.challengeLevel} COMPLETE - ${levelConfig.name}`;
        document.getElementById('td-next-btn').textContent = 'NEXT LEVEL';
      }

      document.getElementById('td-celebration').classList.add('show');
    }

    // Continue to next level
    function nextLevel() {
      document.getElementById('td-celebration').classList.remove('show');
      crowdPeople.forEach(p => { p.userData.jumping = false; });

      if (state.challengeLevel >= 10) {
        // Restart from level 1
        startGame('challenge', 1);
      } else {
        // Next level
        const nextLvl = state.challengeLevel + 1;
        const currentScore = state.score;
        const currentCoins = state.coins;
        const currentTDs = state.touchdowns;

        startGame('challenge', nextLvl);

        // Keep accumulated score/coins/TDs
        state.score = currentScore;
        state.coins = currentCoins;
        state.touchdowns = currentTDs;
      }
    }

    // End game
    function endGame() {
      state.gameOver = true;
      state.gameStarted = false;
      playSound('tackle');
      flashScreen('#ef4444', 300);
      document.getElementById('final-score').textContent = `SCORE: ${Math.floor(state.score).toLocaleString()}`;
      if (state.gameMode === 'challenge') {
        document.getElementById('final-yards').textContent = `${state.touchdowns} TOUCHDOWNS • ${Math.floor(state.yards)} YARDS`;
      } else {
        document.getElementById('final-yards').textContent = `${Math.floor(state.yards)} YARDS`;
      }
      document.getElementById('game-over').classList.add('show');
    }

    // Switch lane (player input)
    function switchLane(direction) {
      if (!state.gameStarted || state.gameOver || state.laneSwitching) return;

      const newLane = state.currentLane + direction;
      if (newLane < 0 || newLane > 2) return;

      playSound('swipe');
      state.laneSwitching = true;
      state.switchTime = 0;
      state.switchStartX = lanes[state.currentLane];
      state.switchEndX = lanes[newLane];
      state.laneSwitchDir = direction;
      state.switchHop = 0.15;
      state.targetLane = newLane;
    }

    // Jump
    function jump() {
      if (!state.gameStarted || state.gameOver) return;
      if (state.jumpHeight === 0 && !state.isJumping) {
        playSound('jump');
        state.isJumping = true;
        state.jumpVelocity = 0.28; // Slightly higher jump
      }
    }

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      if (!state.gameStarted && !state.gameOver) {
        // On start screen, let buttons handle mode selection
        return;
      }

      switch(e.code) {
        case 'ArrowLeft':
        case 'KeyA':
          e.preventDefault();
          switchLane(-1);
          break;
        case 'ArrowRight':
        case 'KeyD':
          e.preventDefault();
          switchLane(1);
          break;
        case 'Space':
        case 'ArrowUp':
        case 'KeyW':
          e.preventDefault();
          jump();
          break;
      }
    });

    // Touch controls
    document.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      if (!state.gameStarted && !state.gameOver) {
        // On start screen, let buttons handle mode selection
        return;
      }

      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;
      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;

      if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 30) {
        switchLane(deltaX > 0 ? 1 : -1);
      } else if (deltaY < -30) {
        jump();
      }
    }, { passive: true });

    // Button handlers - Minimalist UI
    let selectedMode = 'endless';
    const endlessBtn = document.getElementById('endless-btn');
    const challengeBtn = document.getElementById('challenge-btn');
    const playBtn = document.getElementById('play-button');

    // Mode selection (toggle)
    endlessBtn.addEventListener('click', () => {
      selectedMode = 'endless';
      endlessBtn.classList.add('selected');
      challengeBtn.classList.remove('selected');
    });
    challengeBtn.addEventListener('click', () => {
      selectedMode = 'challenge';
      challengeBtn.classList.add('selected');
      endlessBtn.classList.remove('selected');
    });

    // Play button starts game with selected mode
    playBtn.addEventListener('click', () => startGame(selectedMode));
    document.getElementById('retry-button').addEventListener('click', () => startGame(state.gameMode, 1));
    document.getElementById('td-next-btn').addEventListener('click', nextLevel);

    // Mobile touch controls
    document.getElementById('touch-left').addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (state.gameStarted && !state.gameOver) switchLane(-1);
    }, { passive: false });
    document.getElementById('touch-right').addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (state.gameStarted && !state.gameOver) switchLane(1);
    }, { passive: false });
    document.getElementById('touch-jump').addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (state.gameStarted && !state.gameOver) jump();
    }, { passive: false });

    // Scene
    const scene = new THREE.Scene();

    // Add fog to limit visibility - obstacles appear suddenly for reactive gameplay
    scene.fog = new THREE.Fog(0x1e3a5f, 10, 40);

    // Sky
    const skyGeometry = new THREE.PlaneGeometry(250, 120);
    const skyMaterial = new THREE.ShaderMaterial({
      uniforms: { topColor: { value: new THREE.Color(theme.sky[0]) }, bottomColor: { value: new THREE.Color(theme.sky[1]) }, time: { value: 0 } },
      vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `uniform vec3 topColor; uniform vec3 bottomColor; uniform float time; varying vec2 vUv; void main() { float g = pow(vUv.y, 0.7); vec3 c = mix(bottomColor, topColor, g); c += 0.015 * sin(vUv.x * 30.0 + time) * sin(vUv.y * 15.0 + time * 0.7); gl_FragColor = vec4(c, 1.0); }`,
      side: THREE.DoubleSide
    });
    const sky = new THREE.Mesh(skyGeometry, skyMaterial);
    sky.position.set(0, 25, -60);
    scene.add(sky);

    // Field
    const fieldGeometry = new THREE.PlaneGeometry(22, 100, 44, 200);
    const fieldMaterial = new THREE.MeshStandardMaterial({ color: theme.field, roughness: 0.85 });
    const field = new THREE.Mesh(fieldGeometry, fieldMaterial);
    field.rotation.x = -Math.PI / 2;
    field.receiveShadow = true;
    scene.add(field);

    // Field stripes
    for (let i = -45; i < 45; i += 5) {
      const stripeGeometry = new THREE.PlaneGeometry(22, 2.5);
      const stripeMaterial = new THREE.MeshStandardMaterial({ color: i % 2 === 0 ? theme.field : theme.fieldDark, roughness: 0.85 });
      const stripe = new THREE.Mesh(stripeGeometry, stripeMaterial);
      stripe.rotation.x = -Math.PI / 2;
      stripe.position.set(0, 0.001, i + 1.25);
      scene.add(stripe);
    }

    // End zones
    const endZoneMaterial = new THREE.MeshStandardMaterial({ color: theme.endZone, roughness: 0.75 });
    [-50, 50].forEach(z => {
      const ez = new THREE.Mesh(new THREE.PlaneGeometry(22, 10), endZoneMaterial);
      ez.rotation.x = -Math.PI / 2;
      ez.position.set(0, 0.002, z);
      scene.add(ez);
    });

    // Goal posts
    function createGoalPost(z) {
      const g = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, roughness: 0.25, metalness: 0.75 });
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.18, 6, 14), mat);
      base.position.set(0, 3, z);
      g.add(base);
      const cross = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 8, 14), mat);
      cross.position.set(0, 6, z);
      cross.rotation.z = Math.PI / 2;
      g.add(cross);
      [-4, 4].forEach(x => {
        const up = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 6, 10), mat);
        up.position.set(x, 9, z);
        g.add(up);
      });
      return g;
    }
    scene.add(createGoalPost(-55));
    scene.add(createGoalPost(55));

    // Yard lines
    for (let i = -40; i <= 40; i += 5) {
      const lineMat = new THREE.MeshBasicMaterial({ color: theme.lines, transparent: true, opacity: 0.9 });
      const line = new THREE.Mesh(new THREE.PlaneGeometry(20, 0.18), lineMat);
      line.rotation.x = -Math.PI / 2;
      line.position.set(0, 0.02, i);
      scene.add(line);
      [-7, -3.5, 3.5, 7].forEach(x => {
        const hash = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 0.7), lineMat.clone());
        hash.rotation.x = -Math.PI / 2;
        hash.position.set(x, 0.02, i);
        scene.add(hash);
      });
    }

    // Side lines
    [-10, 10].forEach(x => {
      const side = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 100), new THREE.MeshBasicMaterial({ color: theme.lines }));
      side.rotation.x = -Math.PI / 2;
      side.position.set(x, 0.02, 0);
      scene.add(side);
    });

    // Lane markers
    lanes.forEach((laneX, laneIdx) => {
      for (let z = -45; z <= 45; z += 10) {
        const marker = new THREE.Mesh(
          new THREE.PlaneGeometry(0.6, 0.08),
          new THREE.MeshBasicMaterial({ color: theme.lines, transparent: true, opacity: laneIdx === 1 ? 0.25 : 0.12 })
        );
        marker.rotation.x = -Math.PI / 2;
        marker.position.set(laneX, 0.018, z);
        scene.add(marker);
      }
    });

    // Stadium stands with crowd
    const crowdPeople = [];
    [-13, 13].forEach((x, idx) => {
      const standGroup = new THREE.Group();
      for (let tier = 0; tier < 6; tier++) {
        const tierMesh = new THREE.Mesh(
          new THREE.BoxGeometry(3 - tier * 0.35, 1.8, 70),
          new THREE.MeshStandardMaterial({ color: tier % 2 === 0 ? theme.crowd[0] : theme.crowd[1] })
        );
        tierMesh.position.set(idx === 0 ? -tier * 0.55 : tier * 0.55, tier * 1.8 + 0.9, 0);
        standGroup.add(tierMesh);
        for (let col = 0; col < 28; col++) {
          const person = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), new THREE.MeshStandardMaterial({ color: theme.crowd[Math.floor(Math.random() * theme.crowd.length)] }));
          person.position.set(idx === 0 ? -tier * 0.55 + 1.2 : tier * 0.55 - 1.2, tier * 1.8 + 2, -33 + col * 2.4 + Math.random() * 0.8);
          person.userData = { baseY: person.position.y, phase: Math.random() * Math.PI * 2, speed: 1.5 + Math.random() * 1.5, jumping: false };
          standGroup.add(person);
          crowdPeople.push(person);
        }
      }
      standGroup.position.set(x, 0, 0);
      scene.add(standGroup);
    });

    // Stadium walls (stored for scrolling in endless mode)
    const stadiumWalls = [];
    const stadiumScreens = [];
    [-60, 60].forEach(z => {
      const wall = new THREE.Mesh(new THREE.BoxGeometry(32, 15, 1.5), new THREE.MeshStandardMaterial({ color: theme.crowd[0], roughness: 0.7 }));
      wall.position.set(0, 7.5, z);
      wall.userData.baseZ = z;
      scene.add(wall);
      stadiumWalls.push(wall);
      const screen = new THREE.Mesh(new THREE.PlaneGeometry(12, 6), new THREE.MeshBasicMaterial({ color: 0x151515 }));
      screen.position.set(0, 10, z + (z > 0 ? -0.76 : 0.76));
      screen.rotation.y = z > 0 ? Math.PI : 0;
      screen.userData.offset = z > 0 ? -0.76 : 0.76;
      scene.add(screen);
      stadiumScreens.push(screen);
    });

    // Stadium flags
    const flags = [];
    [[-10, 14, -30], [10, 14, -30], [-10, 14, 30], [10, 14, 30]].forEach(pos => {
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 10), new THREE.MeshStandardMaterial({ color: 0x555555 }));
      pole.position.set(pos[0], pos[1] - 5, pos[2]);
      scene.add(pole);
      const flagGeo = new THREE.PlaneGeometry(2.5, 1.5, 10, 5);
      const flag = new THREE.Mesh(flagGeo, new THREE.MeshStandardMaterial({ color: theme.endZone, side: THREE.DoubleSide }));
      flag.position.set(pos[0] + 1.25, pos[1], pos[2]);
      flags.push(flag);
      scene.add(flag);
    });

    // Create stylized football player with clean, recognizable proportions
    function createPlayer(x, z, jerseyColor, helmetColor, pantsColor, isRunner = false) {
      const g = new THREE.Group();
      const s = isRunner ? 1.0 : 1.4; // Defenders are taller/bigger than player

      const jerseyMat = new THREE.MeshStandardMaterial({ color: jerseyColor, roughness: 0.5, metalness: 0.1 });
      const helmetMat = new THREE.MeshStandardMaterial({ color: helmetColor, roughness: 0.15, metalness: 0.8 });
      const pantsMat = new THREE.MeshStandardMaterial({ color: pantsColor, roughness: 0.6 });
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xd4a574, roughness: 0.7 });
      const blackMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.3 });
      const whiteMat = new THREE.MeshStandardMaterial({ color: 0xf8f8f8, roughness: 0.4 });
      const gloveMat = new THREE.MeshStandardMaterial({ color: isRunner ? 0xfafafa : 0x333333, roughness: 0.35 });

      // === TORSO - Clean capsule body ===
      const torso = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.35 * s, 0.5 * s, 12, 16),
        jerseyMat
      );
      torso.position.set(0, 1.1 * s, 0);
      torso.castShadow = true;
      g.add(torso);

      // === SHOULDER PADS - Distinctive football look ===
      const padGeom = new THREE.BoxGeometry(1.1 * s, 0.25 * s, 0.5 * s);
      padGeom.translate(0, 0, 0.05 * s);
      const shoulderPads = new THREE.Mesh(padGeom, jerseyMat);
      shoulderPads.position.set(0, 1.45 * s, 0);
      g.add(shoulderPads);

      // Shoulder caps
      [-0.5, 0.5].forEach(ox => {
        const cap = new THREE.Mesh(
          new THREE.SphereGeometry(0.2 * s, 16, 16),
          jerseyMat
        );
        cap.scale.set(1.2, 0.7, 1);
        cap.position.set(ox * s, 1.42 * s, 0);
        g.add(cap);
      });

      // === NECK ===
      const neck = new THREE.Mesh(
        new THREE.CylinderGeometry(0.1 * s, 0.12 * s, 0.15 * s, 12),
        skinMat
      );
      neck.position.set(0, 1.65 * s, 0);
      g.add(neck);

      // === HELMET - Clean football helmet shape ===
      const helmetGroup = new THREE.Group();
      helmetGroup.position.y = 1.9 * s;

      // Main shell - slightly elongated sphere
      const shell = new THREE.Mesh(
        new THREE.SphereGeometry(0.32 * s, 32, 32),
        helmetMat
      );
      shell.scale.set(1.0, 1.05, 1.1);
      shell.castShadow = true;
      helmetGroup.add(shell);

      // Center stripe
      const stripe = new THREE.Mesh(

      // Ear holes
      [-0.3, 0.3].forEach(ox => {

        );

      // Horizontal bars
      for (let i = 0; i < 3; i++) {

      [-0.15, 0, 0.15].forEach(ox => {

      chinStrap.rotation.x = -0.5;
      helmetGroup.add(chinStrap);

      // Visor for runner
      if (isRunner) {
        const visor = new THREE.Mesh(

        visor.position.set(0, 0.05 * s, 0.1 * s);

        helmetGroup.add(visor);

      g.add(helmetGroup);

      // === HIPS ===
      const hips = new THREE.Mesh(

      );
      hips.rotation.z = Math.PI / 2;
      hips.position.set(0, 0.72 * s, 0);
      g.add(hips);

      // === LEGS - Clear thigh and calf separation ===
      [-0.2, 0.2].forEach((ox, idx) => {
        // Thigh group (rotates at hip)
        const thighGroup = new THREE.Group();
        thighGroup.position.set(ox * s, 0.65 * s, 0);

        const thigh = new THREE.Mesh(
          new THREE.CapsuleGeometry(0.12 * s, 0.3 * s, 8, 12),

        );
        thigh.position.set(0, -0.2 * s, 0);
        thigh.castShadow = true;
        thighGroup.add(thigh);

        thighGroup.name = `thigh${idx}`;
        g.add(thighGroup);

        // Calf group (rotates at knee)
        const calfGroup = new THREE.Group();
        calfGroup.position.set(ox * s, 0.28 * s, 0);

        const calf = new THREE.Mesh(
          new THREE.CapsuleGeometry(0.09 * s, 0.28 * s, 8, 12),
          whiteMat
        );
        calf.position.set(0, -0.18 * s, 0);
        calf.castShadow = true;
        calfGroup.add(calf);

        // Cleat
        const cleat = new THREE.Mesh(
          new THREE.BoxGeometry(0.12 * s, 0.08 * s, 0.2 * s),
