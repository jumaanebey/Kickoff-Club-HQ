<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Blitz Rush - Endless Football Runner</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      font-family: 'Inter', sans-serif;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }
    #game-container canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* HUD */
    .hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
      z-index: 10;
      pointer-events: none;
    }

    .hud-left {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hud-score {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0,0,0,0.5);
      padding: 10px 18px;
      border-radius: 14px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .hud-score-label {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hud-score-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: white;
      letter-spacing: 2px;
    }

    .hud-combo {
      display: none;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(249,115,22,0.9), rgba(234,88,12,0.9));
      padding: 8px 16px;
      border-radius: 20px;
      animation: comboPulse 0.3s ease-out;
    }

    .hud-combo.active { display: flex; }

    @keyframes comboPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .hud-combo-text {
      font-size: 13px;
      font-weight: 700;
      color: white;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hud-right {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
    }

    .hud-coins {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.5);
      padding: 8px 14px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .hud-coins-icon { font-size: 18px; }

    .hud-coins-value {
      font-size: 18px;
      font-weight: 700;
      color: #fbbf24;
    }

    .hud-yards {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      background: rgba(0,0,0,0.4);
      padding: 6px 12px;
      border-radius: 8px;
    }

    .hud-speed {
      width: 100px;
      height: 6px;
      background: rgba(255,255,255,0.15);
      border-radius: 3px;
      overflow: hidden;
    }

    .hud-speed-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      border-radius: 3px;
      transition: width 0.2s;
    }

    .hud-danger {
      display: none;
      align-items: center;
      gap: 6px;
      background: rgba(239,68,68,0.9);
      padding: 6px 12px;
      border-radius: 20px;
      animation: dangerPulse 0.4s ease-in-out infinite alternate;
    }

    .hud-danger.active { display: flex; }

    @keyframes dangerPulse {
      0% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    .hud-danger-text {
      font-size: 12px;
      font-weight: 700;
      color: white;
      text-transform: uppercase;
    }

    /* Announcements */
    .announcement {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 64px;
      color: white;
      text-shadow: 0 4px 20px rgba(0,0,0,0.5);
      pointer-events: none;
      z-index: 100;
      white-space: nowrap;
      letter-spacing: 4px;
    }

    .announcement.show {
      animation: announceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes announceIn {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }

    /* Camera mode indicator */
    .camera-mode {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0,0,0,0.6);
      padding: 10px 16px;
      border-radius: 10px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      z-index: 10;
    }

    .camera-mode-label {
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .camera-mode-value {
      font-size: 16px;
      font-weight: 600;
      color: white;
    }

    /* Start Screen */
    .start-screen {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(15,23,42,0.95), rgba(30,41,59,0.95));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .start-screen.hidden { display: none; }
    .start-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 72px;
      color: #f97316;
      letter-spacing: 6px;
      text-shadow: 0 4px 20px rgba(249,115,22,0.5);
      margin-bottom: 10px;
    }
    .start-subtitle {
      font-size: 18px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 40px;
    }
    .mode-buttons {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }
    .mode-button {
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 3px;
      padding: 18px 40px;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(249,115,22,0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .mode-button:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 40px rgba(249,115,22,0.6);
    }
    .mode-button.challenge {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      box-shadow: 0 8px 30px rgba(34,197,94,0.4);
    }
    .mode-button.challenge:hover {
      box-shadow: 0 12px 40px rgba(34,197,94,0.6);
    }
    .mode-desc {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      margin-top: 8px;
      text-align: center;
      letter-spacing: 1px;
    }
    .start-controls {
      margin-top: 30px;
      text-align: center;
      color: rgba(255,255,255,0.5);
      font-size: 14px;
    }
    .start-controls div { margin: 8px 0; }
    .start-controls span {
      background: rgba(255,255,255,0.1);
      padding: 4px 12px;
      border-radius: 6px;
      margin: 0 4px;
    }

    /* Game Over Screen */
    .game-over {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .game-over.show { display: flex; }
    .game-over-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 64px;
      color: #ef4444;
      letter-spacing: 4px;
      margin-bottom: 20px;
    }
    .game-over-score {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      color: white;
      margin-bottom: 10px;
    }
    .game-over-yards {
      font-size: 20px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 40px;
    }
    .retry-button {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 3px;
      padding: 16px 50px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 6px 25px rgba(34,197,94,0.4);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="hud-overlay">
      <div class="hud-left">
        <div class="hud-score">
          <div>
            <div class="hud-score-label">Score</div>
            <div class="hud-score-value" id="score">0</div>
          </div>
        </div>
        <div class="hud-combo" id="combo">
          <span class="hud-combo-text" id="combo-val">x2</span>
          <span class="hud-combo-text">COMBO</span>
        </div>
      </div>
      <div class="hud-right">
        <div class="hud-coins">
          <span class="hud-coins-icon">🪙</span>
          <span class="hud-coins-value" id="coins">0</span>
        </div>
        <div class="hud-yards" id="yards">0 YDS</div>
        <div class="hud-yards" id="touchdowns" style="display: none; color: #22c55e;">0 TDs</div>
        <div class="hud-speed">
          <div class="hud-speed-fill" id="speed" style="width: 60%"></div>
        </div>
        <div class="hud-danger" id="danger">
          <span>⚠️</span>
          <span class="hud-danger-text">Danger!</span>
        </div>
      </div>
    </div>
    <div class="announcement" id="announcement"></div>
    <div class="camera-mode">
      <div class="camera-mode-label">Camera</div>
      <div class="camera-mode-value" id="camera-mode">Broadcast</div>
    </div>
    <div class="start-screen" id="start-screen">
      <div class="start-title">BLITZ RUSH</div>
      <div class="start-subtitle">Choose Your Mode</div>
      <div class="mode-buttons">
        <div>
          <button class="mode-button" id="endless-button">ENDLESS</button>
          <div class="mode-desc">Run forever. No touchdowns.</div>
        </div>
        <div>
          <button class="mode-button challenge" id="challenge-button">CHALLENGE</button>
          <div class="mode-desc">500-yard field. Score TDs!</div>
        </div>
      </div>
      <div class="start-controls">
        <div><span>←</span> <span>→</span> or <span>A</span> <span>D</span> to switch lanes</div>
        <div><span>SPACE</span> to jump</div>
        <div>On mobile: Swipe left/right</div>
      </div>
    </div>
    <div class="game-over" id="game-over">
      <div class="game-over-title">TACKLED!</div>
      <div class="game-over-score" id="final-score">SCORE: 0</div>
      <div class="game-over-yards" id="final-yards">0 YARDS</div>
      <button class="retry-button" id="retry-button">PLAY AGAIN</button>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // Theme 1: Classic NFL
    const theme = {
      name: 'Classic NFL',
      sky: [0x1e3a5f, 0x87ceeb],
      field: 0x15803d,
      fieldDark: 0x166534,
      endZone: 0xf97316,
      lines: 0xffffff,
      player: 0xf97316,
      playerHelmet: 0xfbbf24,
      playerPants: 0xffffff,
      defender: 0xdc2626,
      defenderHelmet: 0x1e293b,
      defenderPants: 0xffffff,
      obstacle: 0xf97316,
      coin: 0xfbbf24,
      crowd: [0x374151, 0xef4444, 0x3b82f6, 0xfbbf24, 0x22c55e],
      ambient: 0xffffff,
      ambientIntensity: 0.7,
      directional: 0xffffff,
      directionalIntensity: 1.0,
      bloom: { strength: 0.4, radius: 0.5, threshold: 0.75 }
    };

    const container = document.getElementById('game-container');
    const cameraModes = ['Broadcast', 'Chase Cam', 'Cinematic', 'Top Down'];

    // Lane system - 3 lanes like Subway Surfers
    const lanes = [-3.5, 0, 3.5];
    const laneCount = lanes.length;

    // Game state
    const state = {
      gameStarted: false, gameOver: false,
      gameMode: 'endless', // 'endless' or 'challenge'
      fieldLength: 500, // 500 yards for challenge mode
      touchdowns: 0,
      score: 0, coins: 0, speed: 0.8, playerZ: 10, playerX: 0,
      currentLane: 1, targetLane: 1,
      laneSwitching: false, laneSwitchDir: 0,
      switchTime: 0, switchStartX: 0, switchEndX: 0, switchHop: 0,
      yards: 0, yardsInDrive: 0, combo: 0, comboTimer: 0, lastCoinTime: 0,
      lastMilestone: 0,
      tackleRecovery: 0,
      slowMo: false, slowMoTimer: 0,
      screenShake: 0, cameraMode: 0,
      nearMissTimer: 0,
      boosting: false, boostTimer: 0, shielded: false, shieldTimer: 0,
      isJumping: false, jumpHeight: 0, jumpVelocity: 0
    };

    // Player input
    let inputQueue = [];
    let touchStartX = 0;
    let touchStartY = 0;

    // Start game with mode selection
    function startGame(mode = 'endless') {
      state.gameStarted = true;
      state.gameOver = false;
      state.gameMode = mode;
      state.fieldLength = 500; // 500 yards for challenge mode
      state.touchdowns = 0;
      state.score = 0;
      state.coins = 0;
      state.yards = 0;
      state.yardsInDrive = 0;
      state.lastMilestone = 0;
      state.currentLane = 1;
      state.targetLane = 1;
      state.playerZ = 10;
      state.playerX = lanes[1];
      state.speed = 0.8;
      state.jumpHeight = 0;
      state.isJumping = false;
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('game-over').classList.remove('show');

      // Update HUD for mode
      if (mode === 'challenge') {
        document.getElementById('yards').textContent = '0 / 500 YDS';
        document.getElementById('touchdowns').style.display = 'block';
        document.getElementById('touchdowns').textContent = '0 TDs';
      } else {
        document.getElementById('touchdowns').style.display = 'none';
      }
    }

    // End game
    function endGame() {
      state.gameOver = true;
      state.gameStarted = false;
      document.getElementById('final-score').textContent = `SCORE: ${Math.floor(state.score).toLocaleString()}`;
      if (state.gameMode === 'challenge') {
        document.getElementById('final-yards').textContent = `${state.touchdowns} TOUCHDOWNS • ${Math.floor(state.yards)} YARDS`;
      } else {
        document.getElementById('final-yards').textContent = `${Math.floor(state.yards)} YARDS`;
      }
      document.getElementById('game-over').classList.add('show');
    }

    // Switch lane (player input)
    function switchLane(direction) {
      if (!state.gameStarted || state.gameOver || state.laneSwitching) return;

      const newLane = state.currentLane + direction;
      if (newLane < 0 || newLane > 2) return;

      state.laneSwitching = true;
      state.switchTime = 0;
      state.switchStartX = lanes[state.currentLane];
      state.switchEndX = lanes[newLane];
      state.laneSwitchDir = direction;
      state.switchHop = 0.15;
      state.targetLane = newLane;
    }

    // Jump
    function jump() {
      if (!state.gameStarted || state.gameOver) return;
      if (state.jumpHeight === 0 && !state.isJumping) {
        state.isJumping = true;
        state.jumpVelocity = 0.25;
      }
    }

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      if (!state.gameStarted && !state.gameOver) {
        // On start screen, let buttons handle mode selection
        return;
      }

      switch(e.code) {
        case 'ArrowLeft':
        case 'KeyA':
          e.preventDefault();
          switchLane(-1);
          break;
        case 'ArrowRight':
        case 'KeyD':
          e.preventDefault();
          switchLane(1);
          break;
        case 'Space':
        case 'ArrowUp':
        case 'KeyW':
          e.preventDefault();
          jump();
          break;
      }
    });

    // Touch controls
    document.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      if (!state.gameStarted && !state.gameOver) {
        // On start screen, let buttons handle mode selection
        return;
      }

      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;
      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;

      if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 30) {
        switchLane(deltaX > 0 ? 1 : -1);
      } else if (deltaY < -30) {
        jump();
      }
    }, { passive: true });

    // Button handlers
    document.getElementById('endless-button').addEventListener('click', () => startGame('endless'));
    document.getElementById('challenge-button').addEventListener('click', () => startGame('challenge'));
    document.getElementById('retry-button').addEventListener('click', () => startGame(state.gameMode));

    // Scene
    const scene = new THREE.Scene();

    // Sky
    const skyGeometry = new THREE.PlaneGeometry(250, 120);
    const skyMaterial = new THREE.ShaderMaterial({
      uniforms: { topColor: { value: new THREE.Color(theme.sky[0]) }, bottomColor: { value: new THREE.Color(theme.sky[1]) }, time: { value: 0 } },
      vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `uniform vec3 topColor; uniform vec3 bottomColor; uniform float time; varying vec2 vUv; void main() { float g = pow(vUv.y, 0.7); vec3 c = mix(bottomColor, topColor, g); c += 0.015 * sin(vUv.x * 30.0 + time) * sin(vUv.y * 15.0 + time * 0.7); gl_FragColor = vec4(c, 1.0); }`,
      side: THREE.DoubleSide
    });
    const sky = new THREE.Mesh(skyGeometry, skyMaterial);
    sky.position.set(0, 25, -60);
    scene.add(sky);

    // Field
    const fieldGeometry = new THREE.PlaneGeometry(18, 100, 36, 200);
    const fieldMaterial = new THREE.MeshStandardMaterial({ color: theme.field, roughness: 0.85 });
    const field = new THREE.Mesh(fieldGeometry, fieldMaterial);
    field.rotation.x = -Math.PI / 2;
    field.receiveShadow = true;
    scene.add(field);

    // Field stripes
    for (let i = -45; i < 45; i += 5) {
      const stripeGeometry = new THREE.PlaneGeometry(18, 2.5);
      const stripeMaterial = new THREE.MeshStandardMaterial({ color: i % 2 === 0 ? theme.field : theme.fieldDark, roughness: 0.85 });
      const stripe = new THREE.Mesh(stripeGeometry, stripeMaterial);
      stripe.rotation.x = -Math.PI / 2;
      stripe.position.set(0, 0.001, i + 1.25);
      scene.add(stripe);
    }

    // End zones
    const endZoneMaterial = new THREE.MeshStandardMaterial({ color: theme.endZone, roughness: 0.75 });
    [-50, 50].forEach(z => {
      const ez = new THREE.Mesh(new THREE.PlaneGeometry(18, 10), endZoneMaterial);
      ez.rotation.x = -Math.PI / 2;
      ez.position.set(0, 0.002, z);
      scene.add(ez);
    });

    // Goal posts
    function createGoalPost(z) {
      const g = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, roughness: 0.25, metalness: 0.75 });
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.18, 6, 14), mat);
      base.position.set(0, 3, z);
      g.add(base);
      const cross = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 8, 14), mat);
      cross.position.set(0, 6, z);
      cross.rotation.z = Math.PI / 2;
      g.add(cross);
      [-4, 4].forEach(x => {
        const up = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 6, 10), mat);
        up.position.set(x, 9, z);
        g.add(up);
      });
      return g;
    }
    scene.add(createGoalPost(-55));
    scene.add(createGoalPost(55));

    // Yard lines
    for (let i = -40; i <= 40; i += 5) {
      const lineMat = new THREE.MeshBasicMaterial({ color: theme.lines, transparent: true, opacity: 0.9 });
      const line = new THREE.Mesh(new THREE.PlaneGeometry(16, 0.18), lineMat);
      line.rotation.x = -Math.PI / 2;
      line.position.set(0, 0.02, i);
      scene.add(line);
      [-5.5, -2.8, 2.8, 5.5].forEach(x => {
        const hash = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 0.7), lineMat.clone());
        hash.rotation.x = -Math.PI / 2;
        hash.position.set(x, 0.02, i);
        scene.add(hash);
      });
    }

    // Side lines
    [-8, 8].forEach(x => {
      const side = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 100), new THREE.MeshBasicMaterial({ color: theme.lines }));
      side.rotation.x = -Math.PI / 2;
      side.position.set(x, 0.02, 0);
      scene.add(side);
    });

    // Lane markers
    lanes.forEach((laneX, laneIdx) => {
      for (let z = -45; z <= 45; z += 10) {
        const marker = new THREE.Mesh(
          new THREE.PlaneGeometry(0.6, 0.08),
          new THREE.MeshBasicMaterial({ color: theme.lines, transparent: true, opacity: laneIdx === 1 ? 0.25 : 0.12 })
        );
        marker.rotation.x = -Math.PI / 2;
        marker.position.set(laneX, 0.018, z);
        scene.add(marker);
      }
    });

    // Stadium stands with crowd
    const crowdPeople = [];
    [-11, 11].forEach((x, idx) => {
      const standGroup = new THREE.Group();
      for (let tier = 0; tier < 6; tier++) {
        const tierMesh = new THREE.Mesh(
          new THREE.BoxGeometry(3 - tier * 0.35, 1.8, 70),
          new THREE.MeshStandardMaterial({ color: tier % 2 === 0 ? theme.crowd[0] : theme.crowd[1] })
        );
        tierMesh.position.set(idx === 0 ? -tier * 0.55 : tier * 0.55, tier * 1.8 + 0.9, 0);
        standGroup.add(tierMesh);
        for (let col = 0; col < 28; col++) {
          const person = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), new THREE.MeshStandardMaterial({ color: theme.crowd[Math.floor(Math.random() * theme.crowd.length)] }));
          person.position.set(idx === 0 ? -tier * 0.55 + 1.2 : tier * 0.55 - 1.2, tier * 1.8 + 2, -33 + col * 2.4 + Math.random() * 0.8);
          person.userData = { baseY: person.position.y, phase: Math.random() * Math.PI * 2, speed: 1.5 + Math.random() * 1.5, jumping: false };
          standGroup.add(person);
          crowdPeople.push(person);
        }
      }
      standGroup.position.set(x, 0, 0);
      scene.add(standGroup);
    });

    // Stadium walls
    [-60, 60].forEach(z => {
      const wall = new THREE.Mesh(new THREE.BoxGeometry(28, 15, 1.5), new THREE.MeshStandardMaterial({ color: theme.crowd[0], roughness: 0.7 }));
      wall.position.set(0, 7.5, z);
      scene.add(wall);
      const screen = new THREE.Mesh(new THREE.PlaneGeometry(12, 6), new THREE.MeshBasicMaterial({ color: 0x151515 }));
      screen.position.set(0, 10, z + (z > 0 ? -0.76 : 0.76));
      screen.rotation.y = z > 0 ? Math.PI : 0;
      scene.add(screen);
    });

    // Stadium flags
    const flags = [];
    [[-10, 14, -30], [10, 14, -30], [-10, 14, 30], [10, 14, 30]].forEach(pos => {
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 10), new THREE.MeshStandardMaterial({ color: 0x555555 }));
      pole.position.set(pos[0], pos[1] - 5, pos[2]);
      scene.add(pole);
      const flagGeo = new THREE.PlaneGeometry(2.5, 1.5, 10, 5);
      const flag = new THREE.Mesh(flagGeo, new THREE.MeshStandardMaterial({ color: theme.endZone, side: THREE.DoubleSide }));
      flag.position.set(pos[0] + 1.25, pos[1], pos[2]);
      flags.push(flag);
      scene.add(flag);
    });

    // Create stylized football player with clean, recognizable proportions
    function createPlayer(x, z, jerseyColor, helmetColor, pantsColor, isRunner = false) {
      const g = new THREE.Group();
      const s = isRunner ? 1.0 : 0.7; // More reasonable scale

      const jerseyMat = new THREE.MeshStandardMaterial({ color: jerseyColor, roughness: 0.5, metalness: 0.1 });
      const helmetMat = new THREE.MeshStandardMaterial({ color: helmetColor, roughness: 0.15, metalness: 0.8 });
      const pantsMat = new THREE.MeshStandardMaterial({ color: pantsColor, roughness: 0.6 });
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xd4a574, roughness: 0.7 });
      const blackMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.3 });
      const whiteMat = new THREE.MeshStandardMaterial({ color: 0xf8f8f8, roughness: 0.4 });
      const gloveMat = new THREE.MeshStandardMaterial({ color: isRunner ? 0xfafafa : 0x333333, roughness: 0.35 });

      // === TORSO - Clean capsule body ===
      const torso = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.35 * s, 0.5 * s, 12, 16),
        jerseyMat
      );
      torso.position.set(0, 1.1 * s, 0);
      torso.castShadow = true;
      g.add(torso);

      // === SHOULDER PADS - Distinctive football look ===
      const padGeom = new THREE.BoxGeometry(1.1 * s, 0.25 * s, 0.5 * s);
      padGeom.translate(0, 0, 0.05 * s);
      const shoulderPads = new THREE.Mesh(padGeom, jerseyMat);
      shoulderPads.position.set(0, 1.45 * s, 0);
      g.add(shoulderPads);

      // Shoulder caps
      [-0.5, 0.5].forEach(ox => {
        const cap = new THREE.Mesh(
          new THREE.SphereGeometry(0.2 * s, 16, 16),
          jerseyMat
        );
        cap.scale.set(1.2, 0.7, 1);
        cap.position.set(ox * s, 1.42 * s, 0);
        g.add(cap);
      });

      // === NECK ===
      const neck = new THREE.Mesh(
        new THREE.CylinderGeometry(0.1 * s, 0.12 * s, 0.15 * s, 12),
        skinMat
      );
      neck.position.set(0, 1.65 * s, 0);
      g.add(neck);

      // === HELMET - Clean football helmet shape ===
      const helmetGroup = new THREE.Group();
      helmetGroup.position.y = 1.9 * s;

      // Main shell - slightly elongated sphere
      const shell = new THREE.Mesh(
        new THREE.SphereGeometry(0.32 * s, 32, 32),
        helmetMat
      );
      shell.scale.set(1.0, 1.05, 1.1);
      shell.castShadow = true;
      helmetGroup.add(shell);

      // Center stripe
      const stripe = new THREE.Mesh(
        new THREE.BoxGeometry(0.06 * s, 0.35 * s, 0.65 * s),
        whiteMat
      );
      stripe.position.set(0, 0.08 * s, 0);
      helmetGroup.add(stripe);

      // Ear holes
      [-0.3, 0.3].forEach(ox => {
        const earHole = new THREE.Mesh(
          new THREE.CircleGeometry(0.08 * s, 16),
          blackMat
        );
        earHole.position.set(ox * s, -0.02 * s, 0);
        earHole.rotation.y = ox > 0 ? -Math.PI / 2 : Math.PI / 2;
        helmetGroup.add(earHole);
      });

      // Face mask - simplified but clear
      const fmMat = new THREE.MeshStandardMaterial({
        color: isRunner ? 0xcccccc : 0x333333,
        metalness: 0.9,
        roughness: 0.1
      });

      // Horizontal bars
      for (let i = 0; i < 3; i++) {
        const bar = new THREE.Mesh(
          new THREE.CylinderGeometry(0.015 * s, 0.015 * s, 0.5 * s, 8),
          fmMat
        );
        bar.rotation.z = Math.PI / 2;
        bar.position.set(0, -0.1 * s + i * 0.08 * s, 0.32 * s);
        helmetGroup.add(bar);
      }

      // Vertical bars
      [-0.15, 0, 0.15].forEach(ox => {
        const vbar = new THREE.Mesh(
          new THREE.CylinderGeometry(0.015 * s, 0.015 * s, 0.25 * s, 8),
          fmMat
        );
        vbar.position.set(ox * s, -0.02 * s, 0.32 * s);
        helmetGroup.add(vbar);
      });

      // Chin strap
      const chinStrap = new THREE.Mesh(
        new THREE.TorusGeometry(0.18 * s, 0.02 * s, 8, 16, Math.PI * 0.8),
        blackMat
      );
      chinStrap.position.set(0, -0.2 * s, 0.1 * s);
      chinStrap.rotation.x = -0.5;
      helmetGroup.add(chinStrap);

      // Visor for runner
      if (isRunner) {
        const visor = new THREE.Mesh(
          new THREE.SphereGeometry(0.29 * s, 32, 16, 0, Math.PI, 0.3, 0.45),
          new THREE.MeshStandardMaterial({
            color: 0x111122,
            transparent: true,
            opacity: 0.7,
            metalness: 0.95,
            roughness: 0.02
          })
        );
        visor.position.set(0, 0.05 * s, 0.1 * s);
        visor.rotation.x = -0.15;
        helmetGroup.add(visor);
      }

      g.add(helmetGroup);

      // === HIPS ===
      const hips = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.28 * s, 0.15 * s, 8, 12),
        jerseyMat
      );
      hips.rotation.z = Math.PI / 2;
      hips.position.set(0, 0.72 * s, 0);
      g.add(hips);

      // === LEGS - Clear thigh and calf separation ===
      [-0.2, 0.2].forEach((ox, idx) => {
        // Thigh group (rotates at hip)
        const thighGroup = new THREE.Group();
        thighGroup.position.set(ox * s, 0.65 * s, 0);

        const thigh = new THREE.Mesh(
          new THREE.CapsuleGeometry(0.12 * s, 0.3 * s, 8, 12),
          pantsMat
        );
        thigh.position.set(0, -0.2 * s, 0);
        thigh.castShadow = true;
        thighGroup.add(thigh);

        thighGroup.name = `thigh${idx}`;
        g.add(thighGroup);

        // Calf group (rotates at knee)
        const calfGroup = new THREE.Group();
        calfGroup.position.set(ox * s, 0.28 * s, 0);

        const calf = new THREE.Mesh(
          new THREE.CapsuleGeometry(0.09 * s, 0.28 * s, 8, 12),
          whiteMat
        );
        calf.position.set(0, -0.18 * s, 0);
        calf.castShadow = true;
        calfGroup.add(calf);

        // Cleat
        const cleat = new THREE.Mesh(
          new THREE.BoxGeometry(0.12 * s, 0.08 * s, 0.2 * s),
          blackMat
        );
        cleat.position.set(0, -0.38 * s, 0.02 * s);
        calfGroup.add(cleat);

        calfGroup.name = `leg${idx}`;
        g.add(calfGroup);
      });

      // === ARMS - Clean upper/forearm with pumping animation ===
      [-0.48, 0.48].forEach((ox, idx) => {
        // Upper arm group
        const upperArmGroup = new THREE.Group();
        upperArmGroup.position.set(ox * s, 1.38 * s, 0);

        const upperArm = new THREE.Mesh(
          new THREE.CapsuleGeometry(0.08 * s, 0.2 * s, 8, 12),
          jerseyMat
        );
        upperArm.position.set(0, -0.15 * s, 0);
        upperArmGroup.add(upperArm);

        upperArmGroup.name = `upperArm${idx}`;
        g.add(upperArmGroup);

        // Forearm group
        const forearmGroup = new THREE.Group();
        forearmGroup.position.set(ox * s, 1.1 * s, 0.08 * s);

        const forearm = new THREE.Mesh(
          new THREE.CapsuleGeometry(0.06 * s, 0.18 * s, 8, 12),
          skinMat
        );
        forearm.position.set(0, -0.12 * s, 0);
        forearmGroup.add(forearm);

        // Hand/glove
        const hand = new THREE.Mesh(
          new THREE.SphereGeometry(0.06 * s, 12, 12),
          gloveMat
        );
        hand.scale.set(1, 0.8, 0.7);
        hand.position.set(0, -0.26 * s, 0);
        forearmGroup.add(hand);

        forearmGroup.name = `forearm${idx}`;
        g.add(forearmGroup);
      });

      // === FOOTBALL - Tucked under arm for runner ===
      if (isRunner) {
        const footballGroup = new THREE.Group();

        const football = new THREE.Mesh(
          new THREE.SphereGeometry(0.14 * s, 16, 16),
          new THREE.MeshStandardMaterial({ color: 0x8b4513, roughness: 0.55 })
        );
        football.scale.set(0.55, 0.5, 1);
        footballGroup.add(football);

        // Laces
        const laces = new THREE.Mesh(
          new THREE.BoxGeometry(0.02 * s, 0.08 * s, 0.01 * s),
          whiteMat
        );
        laces.position.set(0, 0.06 * s, 0);
        footballGroup.add(laces);

        // White stripes
        [-0.08, 0.08].forEach(zOffset => {
          const stripe = new THREE.Mesh(
            new THREE.TorusGeometry(0.05 * s, 0.008 * s, 8, 16),
            whiteMat
          );
          stripe.rotation.x = Math.PI / 2;
          stripe.position.set(0, 0, zOffset * s);
          footballGroup.add(stripe);
        });

        footballGroup.position.set(0.35 * s, 1.05 * s, 0.15 * s);
        footballGroup.rotation.set(0.3, 0.4, -0.6);
        footballGroup.name = 'football';
        g.add(footballGroup);
      }

      g.position.set(x, 0, z);
      g.castShadow = true;
      return g;
    }

    // Create player
    const player = createPlayer(0, 10, theme.player, theme.playerHelmet, theme.playerPants, true);
    scene.add(player);

    // Motion trail
    const trails = [];
    for (let i = 0; i < 4; i++) {
      const t = new THREE.Mesh(
        new THREE.SphereGeometry(0.12 - i * 0.025, 12, 12),
        new THREE.MeshBasicMaterial({ color: theme.player, transparent: true, opacity: 0.6 - i * 0.14 })
      );
      t.scale.set(1, 0.5, 1.4);
      trails.push(t);
      scene.add(t);
    }

    // Defenders - stationary obstacles in lanes (no chasing!)
    const defenders = [];
    const defenderData = [
      { lane: 1, z: -5 },   // Center lane, close
      { lane: 0, z: -15 },  // Left lane
      { lane: 2, z: -25 },  // Right lane
      { lane: 1, z: -35 },  // Center lane
      { lane: 0, z: -45 },  // Left lane
      { lane: 2, z: -55 },  // Right lane
    ];
    defenderData.forEach((d, i) => {
      const def = createPlayer(lanes[d.lane], d.z, theme.defender, theme.defenderHelmet, theme.defenderPants, false);
      def.userData = { assignedLane: d.lane, baseZ: d.z };
      defenders.push(def);
      scene.add(def);
    });

    // Obstacles - spread out for endless mode, no overlapping
    const obstacles = [];
    const OBSTACLE_SPACING = 12; // Minimum spacing between obstacles

    // Helper to create a cone
    function createCone(x, z) {
      const coneGroup = new THREE.Group();
      const coneMat = new THREE.MeshStandardMaterial({ color: theme.obstacle, roughness: 0.45 });
      const cone = new THREE.Mesh(new THREE.ConeGeometry(0.55, 1.5, 18), coneMat);
      cone.position.y = 0.75;
      cone.castShadow = true;
      coneGroup.add(cone);
      [0.4, 0.8].forEach(h => {
        const cs = new THREE.Mesh(new THREE.CylinderGeometry(0.45 - h * 0.24, 0.5 - h * 0.24, 0.16, 18), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        cs.position.y = h + 0.25;
        coneGroup.add(cs);
      });
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.65, 0.14, 18), new THREE.MeshStandardMaterial({ color: 0x222222 }));
      base.position.y = 0.07;
      coneGroup.add(base);
      coneGroup.position.set(x, 0, z);
      coneGroup.userData = { type: 'cone', baseZ: z, passed: false };
      return coneGroup;
    }

    // Helper to create a hurdle
    function createHurdle(x, z) {
      const hurdleGroup = new THREE.Group();
      const barMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
      const poleMat = new THREE.MeshStandardMaterial({ color: theme.obstacle });
      [-0.8, 0.8].forEach(px => {
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.2, 12), poleMat);
        pole.position.set(px, 0.6, 0);
        pole.castShadow = true;
        hurdleGroup.add(pole);
      });
      const bar = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.12, 0.08), barMat);
      bar.position.y = 1.1;
      bar.castShadow = true;
      hurdleGroup.add(bar);
      hurdleGroup.position.set(x, 0, z);
      hurdleGroup.userData = { type: 'hurdle', baseZ: z, cleared: false, passed: false };
      return hurdleGroup;
    }

    // Helper to create a dummy
    function createDummy(x, z) {
      const dg = new THREE.Group();
      const dm = new THREE.MeshStandardMaterial({ color: 0x1e40af, roughness: 0.55 });
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 2.6, 22), dm);
      body.position.y = 1.3;
      body.castShadow = true;
      dg.add(body);
      const cap = new THREE.Mesh(new THREE.SphereGeometry(0.6, 22, 22, 0, Math.PI * 2, 0, Math.PI / 2), dm);
      cap.position.y = 2.6;
      dg.add(cap);
      [-0.45, 0, 0.45].forEach(yo => {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.61, 0.07, 12, 32), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        ring.position.y = 1.3 + yo;
        ring.rotation.x = Math.PI / 2;
        dg.add(ring);
      });
      dg.position.set(x, 0, z);
      dg.userData = { type: 'dummy', baseZ: z, passed: false };
      return dg;
    }

    // Create initial obstacles - well spaced out
    // Pattern: cone, hurdle, cone, dummy - repeat with good spacing
    const obstaclePattern = [
      { type: 'cone', lane: 0, offset: 0 },
      { type: 'cone', lane: 2, offset: 8 },
      { type: 'hurdle', lane: 1, offset: 20 },
      { type: 'cone', lane: 1, offset: 32 },
      { type: 'dummy', lane: 0, offset: 44 },
      { type: 'cone', lane: 2, offset: 56 },
      { type: 'hurdle', lane: 0, offset: 68 },
      { type: 'cone', lane: 1, offset: 80 },
      { type: 'dummy', lane: 2, offset: 92 },
      { type: 'hurdle', lane: 2, offset: 104 },
    ];

    obstaclePattern.forEach(op => {
      const z = -op.offset;
      const x = lanes[op.lane];
      let obs;
      if (op.type === 'cone') obs = createCone(x, z);
      else if (op.type === 'hurdle') obs = createHurdle(x, z);
      else if (op.type === 'dummy') obs = createDummy(x, z);
      obstacles.push(obs);
      scene.add(obs);
    });

    // Coins
    const coins = [];
    const coinLanePattern = [
      [1, -2], [0, -5], [1, -8], [2, -11], [1, -14],
      [0, -18], [0, -21], [1, -24], [2, -27], [2, -30],
      [1, -33], [0, -36], [1, -39], [2, -42],
      [2, -46], [1, -49], [1, -52]
    ];
    const coinPattern = coinLanePattern.map(([lane, z]) => [lanes[lane], z]);
    coinPattern.forEach((pos, i) => {
      const cg = new THREE.Group();
      const coinMat = new THREE.MeshStandardMaterial({ color: theme.coin, metalness: 0.95, roughness: 0.03, emissive: theme.coin, emissiveIntensity: 0.2 });
      const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.1, 28), coinMat);
      coin.rotation.x = Math.PI / 2;
      cg.add(coin);
      const star = new THREE.Mesh(new THREE.CircleGeometry(0.14, 5), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 }));
      star.position.z = 0.06;
      cg.add(star);
      const ring = new THREE.Mesh(new THREE.RingGeometry(0.4, 0.52, 36), new THREE.MeshBasicMaterial({ color: theme.coin, transparent: true, opacity: 0.4, side: THREE.DoubleSide }));
      ring.rotation.x = Math.PI / 2;
      cg.add(ring);
      cg.position.set(pos[0], 0.9 + Math.sin(i * 0.6) * 0.18, pos[1]);
      cg.userData = { collected: false, idx: i };
      coins.push(cg);
      scene.add(cg);
    });

    // Particle systems
    const turfCount = 200;
    const turfGeo = new THREE.BufferGeometry();
    const turfPos = new Float32Array(turfCount * 3);
    for (let i = 0; i < turfCount * 3; i++) turfPos[i] = -100;
    turfGeo.setAttribute('position', new THREE.BufferAttribute(turfPos, 3));
    const turfMat = new THREE.PointsMaterial({ color: 0x22c55e, size: 0.08, transparent: true, opacity: 0.8 });
    const turfSys = new THREE.Points(turfGeo, turfMat);
    scene.add(turfSys);
    const turfVel = Array(turfCount).fill(null).map(() => ({ vx: 0, vy: 0, vz: 0, life: 0, active: false }));

    const sparkCount = 100;
    const sparkGeo = new THREE.BufferGeometry();
    const sparkPos = new Float32Array(sparkCount * 3);
    for (let i = 0; i < sparkCount * 3; i++) sparkPos[i] = -100;
    sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
    const sparkMat = new THREE.PointsMaterial({ color: 0xfbbf24, size: 0.15, transparent: true, opacity: 0.9 });
    const sparkSys = new THREE.Points(sparkGeo, sparkMat);
    scene.add(sparkSys);
    const sparkVel = Array(sparkCount).fill(null).map(() => ({ vx: 0, vy: 0, vz: 0, life: 0, active: false }));

    const confettiCount = 150;
    const confettiGeo = new THREE.BufferGeometry();
    const confettiPos = new Float32Array(confettiCount * 3);
    for (let i = 0; i < confettiCount * 3; i++) confettiPos[i] = -100;
    confettiGeo.setAttribute('position', new THREE.BufferAttribute(confettiPos, 3));
    const confettiMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.25, transparent: true, opacity: 0.9 });
    const confettiSys = new THREE.Points(confettiGeo, confettiMat);
    scene.add(confettiSys);
    const confettiVel = Array(confettiCount).fill(null).map(() => ({ vx: 0, vy: 0, vz: 0, life: 0, active: false }));

    function spawnTurf(x, z) {
      const posArr = turfSys.geometry.attributes.position.array;
      for (let i = 0; i < 8; i++) {
        const idx = turfVel.findIndex(v => !v.active);
        if (idx >= 0) {
          posArr[idx * 3] = x + (Math.random() - 0.5) * 0.4;
          posArr[idx * 3 + 1] = 0.1;
          posArr[idx * 3 + 2] = z + (Math.random() - 0.5) * 0.4;
          turfVel[idx] = { vx: (Math.random() - 0.5) * 0.1, vy: 0.08 + Math.random() * 0.06, vz: (Math.random() - 0.5) * 0.08, life: 1, active: true };
        }
      }
      turfSys.geometry.attributes.position.needsUpdate = true;
    }

    function spawnSparkle(x, y, z, count = 10) {
      const posArr = sparkSys.geometry.attributes.position.array;
      for (let i = 0; i < count; i++) {
        const idx = sparkVel.findIndex(v => !v.active);
        if (idx >= 0) {
          posArr[idx * 3] = x;
          posArr[idx * 3 + 1] = y;
          posArr[idx * 3 + 2] = z;
          const angle = Math.random() * Math.PI * 2;
          const speed = 0.08 + Math.random() * 0.12;
          sparkVel[idx] = { vx: Math.cos(angle) * speed, vy: 0.05 + Math.random() * 0.1, vz: Math.sin(angle) * speed, life: 1, active: true };
        }
      }
      sparkSys.geometry.attributes.position.needsUpdate = true;
    }

    function spawnConfetti(x, z) {
      const posArr = confettiSys.geometry.attributes.position.array;
      for (let i = 0; i < 50; i++) {
        const idx = confettiVel.findIndex(v => !v.active);
        if (idx >= 0) {
          posArr[idx * 3] = x + (Math.random() - 0.5) * 2;
          posArr[idx * 3 + 1] = 2 + Math.random() * 3;
          posArr[idx * 3 + 2] = z + (Math.random() - 0.5) * 2;
          confettiVel[idx] = { vx: (Math.random() - 0.5) * 0.15, vy: 0.1 + Math.random() * 0.15, vz: (Math.random() - 0.5) * 0.15, life: 1, active: true };
        }
      }
      confettiSys.geometry.attributes.position.needsUpdate = true;
    }

    // Lighting
    const ambient = new THREE.AmbientLight(theme.ambient, theme.ambientIntensity);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(theme.directional, theme.directionalIntensity);
    sun.position.set(8, 25, 15);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 100;
    sun.shadow.camera.left = -30;
    sun.shadow.camera.right = 30;
    sun.shadow.camera.top = 50;
    sun.shadow.camera.bottom = -50;
    scene.add(sun);

    // Camera
    const camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.1, 200);
    camera.position.set(0, 12, 26);
    camera.lookAt(0, 1, 0);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Post-processing
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(container.clientWidth, container.clientHeight), theme.bloom.strength, theme.bloom.radius, theme.bloom.threshold);
    composer.addPass(bloom);

    // Announcement system
    function announce(text, color) {
      const el = document.getElementById('announcement');
      el.textContent = text;
      el.style.color = color;
      el.classList.remove('show');
      void el.offsetWidth;
      el.classList.add('show');
    }

    // Animation
    let lastTime = 0;
    function animate(currentTime) {
      requestAnimationFrame(animate);

      const time = currentTime * 0.001;
      const dt = Math.min(time - lastTime, 0.1);
      lastTime = time;
      const now = Date.now();

      // Update sky
      sky.material.uniforms.time.value = time;

      // Only run game logic if game is started
      if (!state.gameStarted || state.gameOver) {
        // Still render the scene even when not playing
        composer.render();
        return;
      }

      // Spawn turf particles
      if (Math.random() < 0.4) spawnTurf(player.position.x, player.position.z + 0.5);

      // Timers
      if (state.boostTimer > 0) { state.boostTimer -= dt; state.boosting = state.boostTimer > 0; }
      if (state.shieldTimer > 0) { state.shieldTimer -= dt; state.shielded = state.shieldTimer > 0; }
      if (state.tackleRecovery > 0) state.tackleRecovery -= dt;
      if (state.slowMoTimer > 0) { state.slowMoTimer -= dt; if (state.slowMoTimer <= 0) state.slowMo = false; }
      if (state.screenShake > 0) state.screenShake -= dt * 2;

      // Camera mode - fixed to Chase Cam for gameplay
      state.cameraMode = 1;
      document.getElementById('camera-mode').textContent = 'Chase Cam';

      // Speed - starts fast and increases over time
      const baseSpeed = Math.min(0.8 + state.yards * 0.0005, 1.5) * (state.boosting ? 1.5 : 1);

      // Execute lane switch (player controlled)
      if (state.laneSwitching) {
        state.switchTime += dt * 10;

        if (state.switchTime >= 1) {
          state.switchTime = 1;
          state.laneSwitching = false;
          state.currentLane = state.targetLane;
          state.playerX = lanes[state.currentLane];
          state.switchHop = 0;
        } else {
          const t = state.switchTime;
          state.playerX = state.switchStartX + (state.switchEndX - state.switchStartX) * t;
          state.switchHop = Math.sin(t * Math.PI) * 0.3;
        }
      } else {
        state.playerX = lanes[state.currentLane];
        state.switchHop = 0;
      }

      // Jump physics
      if (state.isJumping || state.jumpHeight > 0) {
        state.jumpHeight += state.jumpVelocity;
        state.jumpVelocity -= 0.015; // gravity
        if (state.jumpHeight <= 0) {
          state.jumpHeight = 0;
          state.jumpVelocity = 0;
          state.isJumping = false;
        }
      }

      player.position.x = state.playerX;
      const moveAmount = 0.18 * baseSpeed * (state.slowMo ? 0.25 : 1);
      state.playerZ -= moveAmount;
      state.yards += moveAmount;
      state.yardsInDrive += moveAmount;
      state.score += 0.5 * baseSpeed;
      player.position.z = state.playerZ;

      // Mode-specific logic
      if (state.gameMode === 'endless') {
        // Endless mode - no touchdowns, just milestones every 100 yards
        const yardMilestone = Math.floor(state.yards / 100) * 100;
        if (yardMilestone > 0 && yardMilestone > state.lastMilestone) {
          state.lastMilestone = yardMilestone;
          announce(`${yardMilestone} YARDS!`, '#f97316');
          spawnConfetti(player.position.x, player.position.z);
          state.score += 100;
          crowdPeople.forEach(p => { p.userData.jumping = true; });
          setTimeout(() => crowdPeople.forEach(p => { p.userData.jumping = false; }), 2000);
        }
      } else if (state.gameMode === 'challenge') {
        // Challenge mode - score touchdown at 500 yards
        if (state.yardsInDrive >= state.fieldLength) {
          // TOUCHDOWN!
          state.touchdowns++;
          state.score += 700; // 7 points * 100
          announce('TOUCHDOWN!', '#22c55e');
          spawnConfetti(player.position.x, player.position.z);
          crowdPeople.forEach(p => { p.userData.jumping = true; });
          setTimeout(() => crowdPeople.forEach(p => { p.userData.jumping = false; }), 3000);

          // Reset for next drive
          state.yardsInDrive = 0;
          state.playerZ = 10;
          state.currentLane = 1;
          state.targetLane = 1;
          state.playerX = lanes[1];
          player.position.set(lanes[1], 0, 10);

          // Increase difficulty slightly
          state.speed = Math.min(state.speed + 0.1, 2.0);
        }
      }

      // Player animation
      if (state.laneSwitching) {
        player.rotation.z = -state.laneSwitchDir * 0.15;
        player.rotation.y = state.laneSwitchDir * 0.1;
        player.position.y = state.switchHop;
      } else {
        player.rotation.z = 0;
        player.rotation.y = 0;
      }

      // Running gait
      const runSpd = 14 * baseSpeed;
      const gaitCycle = time * runSpd;
      const strideIntensity = state.boosting ? 1.3 : 1.0;
      const laneSwitchMod = state.laneSwitching ? 0.7 : 1.0;

      player.children.forEach(child => {
        if (child.name?.includes('thigh')) {
          const isLeft = child.name.includes('0');
          const phase = isLeft ? 0 : Math.PI;
          const cycle = gaitCycle + phase;
          const forwardSwing = Math.sin(cycle);
          const thighAngle = forwardSwing > 0 ? forwardSwing * 0.8 : forwardSwing * 0.6 * 0.7;
          child.rotation.x = thighAngle * strideIntensity * laneSwitchMod;
          if (state.laneSwitching) {
            child.rotation.z = state.laneSwitchDir * 0.15 * (isLeft ? 1 : -1);
          } else {
            child.rotation.z = 0;
          }
        }
        if (child.name?.includes('leg') && !child.name?.includes('thigh')) {
          const isLeft = child.name.includes('0');
          const phase = isLeft ? 0 : Math.PI;
          const cycle = gaitCycle + phase;
          const swing = Math.sin(cycle);
          child.rotation.x = swing > 0 ? Math.pow(swing, 1.5) * 1.2 : swing * 0.15;
        }
        if (child.name?.includes('upperArm')) {
          const isLeft = child.name.includes('0');
          const phase = isLeft ? Math.PI : 0;
          child.rotation.x = Math.sin(gaitCycle + phase) * 0.5 * strideIntensity;
        }
        if (child.name?.includes('forearm')) {
          const isLeft = child.name.includes('0');
          const phase = isLeft ? Math.PI : 0;
          child.rotation.x = -0.4 + Math.sin(gaitCycle + phase + 0.5) * 0.25;
        }
      });

      // Obstacle collision and respawning for endless mode
      obstacles.forEach((obs, idx) => {
        const odx = obs.position.x - player.position.x;
        const odz = obs.position.z - player.position.z;

        // Respawn obstacles that are behind the player (endless mode)
        if (obs.position.z > state.playerZ + 10) {
          // Respawn far ahead
          obs.position.z = state.playerZ - 80 - Math.random() * 40;
          obs.position.x = lanes[Math.floor(Math.random() * 3)];
          obs.userData.passed = false;
          obs.userData.cleared = false;
          obs.rotation.set(0, 0, 0);
        }

        // Check if player passed this obstacle (for feedback)
        if (!obs.userData.passed && obs.position.z > state.playerZ + 2) {
          obs.userData.passed = true;
          state.score += 10;
        }

        // Only check collision if obstacle is close
        if (Math.abs(odz) > 3) return;

        const sameLane = Math.abs(odx) < 1.5;

        // CONE - can knock over, minor penalty
        if (obs.userData.type === 'cone' && sameLane && Math.abs(odz) < 1.0) {
          if (!obs.userData.knocked) {
            obs.userData.knocked = true;
            obs.rotation.x = Math.random() > 0.5 ? 1.2 : -1.2;
            obs.rotation.z = (Math.random() - 0.5) * 1.5;
            // Small slowdown but no game over
            state.speed *= 0.9;
          }
        }

        // HURDLE - must jump over!
        if (obs.userData.type === 'hurdle' && sameLane && odz < 0.5 && odz > -1.5) {
          if (state.jumpHeight < 0.7) {
            state.screenShake = 0.8;
            announce('TRIPPED!', '#ef4444');
            endGame();
            return;
          } else if (!obs.userData.cleared) {
            obs.userData.cleared = true;
            state.score += 50;
            announce('NICE JUMP!', '#22c55e');
          }
        }

        // DUMMY - must dodge!
        if (obs.userData.type === 'dummy' && sameLane && Math.abs(odz) < 1.2) {
          state.screenShake = 1.0;
          announce('BLOCKED!', '#ef4444');
          endGame();
          return;
        }
      });

      // Player Y position includes jump and lane switch hop
      player.position.y = state.jumpHeight + (state.laneSwitching ? state.switchHop : 0);

      // Defenders as stationary obstacles - NO CHASING
      // They stand in lanes and you dodge around them
      let closestDist = Infinity;

      defenders.forEach((def, i) => {
        // Keep defenders in their assigned lane
        if (def.userData.assignedLane === undefined) {
          def.userData.assignedLane = i % laneCount;
          def.userData.baseZ = def.position.z;
        }

        // Defender stays in their lane
        def.position.x = lanes[def.userData.assignedLane];

        // Defenders scroll with the field (stationary relative to field)
        // When they go behind player, respawn ahead
        if (def.position.z > state.playerZ + 8) {
          // Respawn ahead of player
          def.position.z = state.playerZ - 25 - Math.random() * 20;
          def.userData.assignedLane = Math.floor(Math.random() * laneCount);
          def.position.x = lanes[def.userData.assignedLane];
        }

        // Face the player
        def.rotation.y = Math.PI;

        // Idle stance animation (just slight movement)
        def.position.y = Math.sin(time * 2 + i) * 0.02;

        // Calculate distance for collision
        const dx = def.position.x - state.playerX;
        const dz = def.position.z - state.playerZ;
        const dist = Math.sqrt(dx * dx + dz * dz);
        if (dist < closestDist) closestDist = dist;

        // Collision detection - hit defender = game over
        if (dist < 1.0 && Math.abs(dz) < 1.2) {
          state.screenShake = 1.5;
          announce('TACKLED!', '#ef4444');
          endGame();
          return;
        }

        // Near miss bonus
        if (dist < 1.8 && dist > 1.0 && Math.abs(dz) < 1.5 && state.nearMissTimer <= 0) {
          state.nearMissTimer = 0.8;
          state.score += 25;
          announce('JUKE!', '#22c55e');
        }
      });

      // Danger indicator
      if (closestDist < 2.5) {
        document.getElementById('danger').classList.add('active');
      } else {
        document.getElementById('danger').classList.remove('active');
      }
      if (state.nearMissTimer > 0) state.nearMissTimer -= dt;

      // Update particles
      const turfPosArr = turfSys.geometry.attributes.position.array;
      turfVel.forEach((v, i) => {
        if (v.active) {
          turfPosArr[i * 3] += v.vx;
          turfPosArr[i * 3 + 1] += v.vy;
          turfPosArr[i * 3 + 2] += v.vz;
          v.vy -= 0.01;
          v.life -= 0.03;
          if (v.life <= 0 || turfPosArr[i * 3 + 1] < 0) {
            v.active = false;
            turfPosArr[i * 3 + 1] = -20;
          }
        }
      });
      turfSys.geometry.attributes.position.needsUpdate = true;

      const sparkPosArr = sparkSys.geometry.attributes.position.array;
      sparkVel.forEach((v, i) => {
        if (v.active) {
          sparkPosArr[i * 3] += v.vx;
          sparkPosArr[i * 3 + 1] += v.vy;
          sparkPosArr[i * 3 + 2] += v.vz;
          v.vy -= 0.008;
          v.life -= 0.04;
          if (v.life <= 0) {
            v.active = false;
            sparkPosArr[i * 3 + 1] = -20;
          }
        }
      });
      sparkSys.geometry.attributes.position.needsUpdate = true;

      const confettiPosArr = confettiSys.geometry.attributes.position.array;
      confettiVel.forEach((v, i) => {
        if (v.active) {
          confettiPosArr[i * 3] += v.vx + Math.sin(time * 3 + i) * 0.02;
          confettiPosArr[i * 3 + 1] += v.vy;
          confettiPosArr[i * 3 + 2] += v.vz;
          v.vy -= 0.006;
          v.life -= 0.015;
          if (v.life <= 0 || confettiPosArr[i * 3 + 1] < 0) {
            v.active = false;
            confettiPosArr[i * 3 + 1] = -20;
          }
        }
      });
      confettiSys.geometry.attributes.position.needsUpdate = true;

      // Coins
      coins.forEach((cg, i) => {
        if (!cg.userData.collected) {
          cg.rotation.y += 0.07;
          cg.position.y = 0.9 + Math.sin(time * 4 + i * 0.7) * 0.2;
          const ring = cg.children[2];
          if (ring) ring.scale.setScalar(1 + Math.sin(time * 6 + i) * 0.15);

          const cdx = cg.position.x - player.position.x;
          const cdz = cg.position.z - player.position.z;
          if (Math.abs(cdx) < 0.9 && Math.abs(cdz) < 0.9) {
            cg.userData.collected = true;
            spawnSparkle(cg.position.x, cg.position.y, cg.position.z, 12);
            cg.visible = false;

            if (now - state.lastCoinTime < 1500) {
              state.combo = Math.min(state.combo + 1, 10);
              state.comboTimer = 2;
            } else {
              state.combo = 1;
              state.comboTimer = 2;
            }
            state.lastCoinTime = now;

            const points = 100 * state.combo;
            state.coins++;
            state.score += points;

            if (state.combo >= 3) {
              announce(`x${state.combo} COMBO!`, '#fbbf24');
            }

            setTimeout(() => { cg.userData.collected = false; cg.visible = true; }, 2500);
          }
        }
      });

      // Combo timer
      if (state.comboTimer > 0) {
        state.comboTimer -= dt;
        document.getElementById('combo').classList.add('active');
        document.getElementById('combo-val').textContent = `x${state.combo}`;
      } else {
        state.combo = 0;
        document.getElementById('combo').classList.remove('active');
      }

      // Update trail
      trails.forEach((t, i) => {
        t.position.x = player.position.x * (1 - i * 0.06);
        t.position.z = player.position.z + 0.55 + i * 0.35;
        t.position.y = 0.28 + Math.sin(time * 12 + i) * 0.05;
      });

      // Crowd animation
      crowdPeople.forEach((p, i) => {
        if (p.userData.jumping) {
          p.position.y = p.userData.baseY + Math.abs(Math.sin(time * 8 + i * 0.2)) * 0.6;
        } else {
          const wave = time * p.userData.speed - i * 0.08;
          p.position.y = p.userData.baseY + Math.max(0, Math.sin(wave)) * 0.35;
        }
      });
      if (!state.touchdown) crowdPeople.forEach(p => { p.userData.jumping = false; });

      // Flags
      flags.forEach((f, i) => {
        const pos = f.geometry.attributes.position;
        for (let j = 0; j < pos.count; j++) {
          const x = pos.getX(j);
          pos.setZ(j, Math.sin(time * 4 + x * 2.5 + i) * 0.18);
        }
        pos.needsUpdate = true;
      });

      // Camera
      const camMode = state.cameraMode;
      let camX = 0, camY = 12, camZ = 26, lookX = 0, lookY = 1, lookZ = 0;

      if (camMode === 0) { // Broadcast
        camX = state.playerX * 0.3;
        camY = 11 + Math.sin(time * 0.6) * 0.6;
        camZ = state.playerZ + 16;
        lookX = state.playerX * 0.5;
        lookZ = state.playerZ - 6;
      } else if (camMode === 1) { // Chase cam
        camX = state.playerX * 0.8;
        camY = 4;
        camZ = state.playerZ + 6;
        lookX = state.playerX;
        lookZ = state.playerZ - 8;
        lookY = 1.5;
      } else if (camMode === 2) { // Cinematic
        camX = Math.sin(time * 0.3) * 8;
        camY = 8 + Math.sin(time * 0.5) * 3;
        camZ = state.playerZ + Math.cos(time * 0.3) * 12;
        lookX = state.playerX;
        lookZ = state.playerZ;
      } else if (camMode === 3) { // Top down
        camX = state.playerX * 0.5;
        camY = 22;
        camZ = state.playerZ + 5;
        lookX = state.playerX;
        lookZ = state.playerZ;
        lookY = 0;
      }

      camera.position.x += (camX - camera.position.x) * 0.06;
      camera.position.y += (camY - camera.position.y) * 0.06;
      camera.position.z += (camZ - camera.position.z) * 0.04;
      camera.lookAt(lookX, lookY, lookZ);

      // Screen shake
      if (state.screenShake > 0) {
        camera.position.x += (Math.random() - 0.5) * state.screenShake * 0.3;
        camera.position.y += (Math.random() - 0.5) * state.screenShake * 0.2;
      }

      // Update HUD
      document.getElementById('score').textContent = Math.floor(state.score).toLocaleString();
      document.getElementById('coins').textContent = state.coins;
      if (state.gameMode === 'challenge') {
        document.getElementById('yards').textContent = `${Math.floor(state.yardsInDrive)} / ${state.fieldLength} YDS`;
        document.getElementById('touchdowns').textContent = `${state.touchdowns} TDs`;
      } else {
        document.getElementById('yards').textContent = `${Math.floor(state.yards)} YDS`;
      }
      document.getElementById('speed').style.width = `${(baseSpeed / 1.2) * 100}%`;

      composer.render();
    }
    animate(0);

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
      composer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
