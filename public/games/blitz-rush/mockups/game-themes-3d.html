<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blitz Rush - 3D Theme Options</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 1500px;
      margin: 0 auto;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 56px;
      font-weight: 400;
      color: white;
      text-align: center;
      margin-bottom: 8px;
      text-shadow: 0 4px 30px rgba(249,115,22,0.5);
      letter-spacing: 4px;
    }

    .subtitle {
      font-size: 16px;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 48px;
    }

    .themes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(460px, 1fr));
      gap: 32px;
    }

    .theme-card {
      background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
      border-radius: 24px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.05);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    .theme-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(249,115,22,0.15) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 1;
    }

    .theme-card:hover {
      border-color: #f97316;
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 60px rgba(249,115,22,0.3);
    }

    .theme-card:hover::before {
      opacity: 1;
    }

    .theme-preview {
      height: 400px;
      position: relative;
      overflow: hidden;
      background: #000;
      cursor: pointer;
    }

    .theme-preview canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* Enhanced HUD */
    .hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
      z-index: 10;
      pointer-events: none;
    }

    .hud-left {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hud-score {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.6);
      padding: 8px 16px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .hud-score-label {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hud-score-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: white;
      letter-spacing: 2px;
    }

    .hud-combo {
      display: none;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(249,115,22,0.8), rgba(234,88,12,0.8));
      padding: 6px 14px;
      border-radius: 20px;
      animation: comboPulse 0.3s ease-out;
    }

    .hud-combo.active {
      display: flex;
    }

    @keyframes comboPulse {
      0% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    .hud-combo-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      color: white;
    }

    .hud-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .hud-coins {
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(251,191,36,0.3), rgba(245,158,11,0.2));
      padding: 8px 16px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(251,191,36,0.3);
    }

    .hud-coins-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      color: #fbbf24;
      letter-spacing: 1px;
    }

    .hud-yards {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      background: rgba(0,0,0,0.4);
      padding: 4px 10px;
      border-radius: 8px;
    }

    /* Announcer overlay */
    .announcer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      color: white;
      text-shadow: 0 4px 20px rgba(0,0,0,0.8), 0 0 40px currentColor;
      z-index: 20;
      pointer-events: none;
      opacity: 0;
      transition: none;
    }

    .announcer.show {
      animation: announceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes announceIn {
      0% { transform: translate(-50%, -50%) scale(0) rotate(-10deg); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.2) rotate(5deg); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 0; }
    }

    /* Danger indicator */
    .danger-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      opacity: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(239,68,68,0.4) 100%);
      transition: opacity 0.1s;
    }

    .danger-overlay.active {
      opacity: 1;
      animation: dangerPulse 0.2s ease-in-out infinite alternate;
    }

    @keyframes dangerPulse {
      0% { opacity: 0.3; }
      100% { opacity: 0.6; }
    }

    /* Speed boost indicator */
    .boost-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 14;
      opacity: 0;
      background: linear-gradient(90deg, transparent 30%, rgba(34,197,94,0.2) 50%, transparent 70%);
    }

    .boost-overlay.active {
      opacity: 1;
      animation: boostStreak 0.3s linear infinite;
    }

    @keyframes boostStreak {
      0% { background-position: -100% 0; }
      100% { background-position: 200% 0; }
    }

    /* Speed meter */
    .speed-meter {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 10;
      pointer-events: none;
    }

    .speed-bar-bg {
      width: 100px;
      height: 8px;
      background: rgba(0,0,0,0.5);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .speed-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #84cc16, #fbbf24, #f97316, #ef4444);
      border-radius: 4px;
      transition: width 0.1s;
      box-shadow: 0 0 10px currentColor;
    }

    .speed-label {
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Camera mode indicator */
    .camera-mode {
      position: absolute;
      bottom: 16px;
      right: 16px;
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      background: rgba(0,0,0,0.4);
      padding: 4px 10px;
      border-radius: 6px;
      z-index: 10;
      pointer-events: none;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .theme-info {
      padding: 24px;
      position: relative;
      z-index: 2;
    }

    .theme-number {
      font-size: 11px;
      font-weight: 700;
      color: #f97316;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .theme-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: white;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }

    .theme-desc {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .color-palette {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .color-swatch {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.1);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }

    .color-swatch:hover {
      transform: scale(1.2) rotate(5deg);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .features {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .feature-tag {
      padding: 8px 16px;
      background: rgba(249,115,22,0.1);
      color: #f97316;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid rgba(249,115,22,0.2);
      transition: all 0.2s;
    }

    .feature-tag:hover {
      background: rgba(249,115,22,0.2);
      transform: translateY(-2px);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 32px;
      color: #64748b;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: white;
    }

    .footer {
      text-align: center;
      margin-top: 48px;
      color: #64748b;
      font-size: 14px;
    }

    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #64748b;
      font-size: 14px;
    }

    .click-hint {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      z-index: 10;
      pointer-events: none;
    }

    @media (max-width: 500px) {
      .themes-grid { grid-template-columns: 1fr; }
      h1 { font-size: 36px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/games/blitz-rush" class="back-link">← Back to Game</a>

    <h1>BLITZ RUSH 3D THEMES</h1>
    <p class="subtitle">Live gameplay with slow-mo, jukes, tackles & celebrations - Click to change camera!</p>

    <div class="themes-grid" id="themes-grid"></div>

    <p class="footer">Select your favorite theme and we'll implement it!</p>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

    // Theme data
    const themesData = [
      { id: 1, name: 'Classic NFL', desc: 'Traditional football aesthetic with vibrant green turf, orange player jersey, and red defenders. Clean, professional look.', label: 'Option 1 - Recommended', colors: ['#15803d', '#f97316', '#dc2626', '#fbbf24'], tags: ['Green Turf', 'Orange Runner', 'Red Defenders'] },
      { id: 2, name: 'Night Game', desc: 'Prime time atmosphere with deep blues and purples. Cyan player stands out against purple defenders under stadium lights.', label: 'Option 2', colors: ['#1e1b4b', '#0ea5e9', '#9333ea', '#22d3ee'], tags: ['Stadium Lights', 'Cyan Runner', 'Purple Defenders'] },
      { id: 3, name: 'Retro Arcade', desc: '80s arcade game vibes with neon glow effects, black background, and pixel-perfect colors.', label: 'Option 3', colors: ['#18181b', '#22c55e', '#ef4444', '#ec4899'], tags: ['Neon Glow', 'Black Field', 'Retro Vibes'] },
      { id: 4, name: 'Sunset Stadium', desc: 'Golden hour atmosphere with warm orange and amber tones. Gold-jersey player faces off against shadowy defenders.', label: 'Option 4', colors: ['#ea580c', '#fbbf24', '#365314', '#334155'], tags: ['Golden Hour', 'Warm Tones', 'Cinematic'] },
      { id: 5, name: 'Winter Classic', desc: 'Outdoor winter game on a snowy field. Cool blue tones with icy blue player jersey against the white snow.', label: 'Option 5', colors: ['#e2e8f0', '#0ea5e9', '#334155', '#fbbf24'], tags: ['Falling Snow', 'Icy Field', 'Blue Runner'] },
      { id: 6, name: 'Neon Future', desc: 'Cyberpunk-inspired futuristic stadium with vivid neon colors. Pink/magenta player glows against cyan defenders.', label: 'Option 6', colors: ['#0c0a1d', '#e879f9', '#06b6d4', '#f43f5e'], tags: ['Cyberpunk', 'Neon Glow', 'Futuristic'] }
    ];

    // Generate HTML for theme cards
    const grid = document.getElementById('themes-grid');
    themesData.forEach(t => {
      grid.innerHTML += `
        <div class="theme-card">
          <div class="theme-preview" id="preview-${t.id}">
            <div class="loading">Loading 3D...</div>
            <div class="hud-overlay">
              <div class="hud-left">
                <div class="hud-score">
                  <div>
                    <div class="hud-score-label">Score</div>
                    <div class="hud-score-value" id="score-${t.id}">0</div>
                  </div>
                </div>
                <div class="hud-combo" id="combo-${t.id}">
                  <span class="hud-combo-value" id="combo-val-${t.id}">x2</span>
                  <span style="font-size:11px;color:rgba(255,255,255,0.8)">COMBO</span>
                </div>
              </div>
              <div class="hud-right">
                <div class="hud-coins">
                  <span style="font-size:20px;">🪙</span>
                  <span class="hud-coins-value" id="coins-${t.id}">0</span>
                </div>
                <div class="hud-yards" id="yards-${t.id}">0 YDS</div>
              </div>
            </div>
            <div class="announcer" id="announcer-${t.id}">TOUCHDOWN!</div>
            <div class="danger-overlay" id="danger-${t.id}"></div>
            <div class="boost-overlay" id="boost-${t.id}"></div>
            <div class="speed-meter">
              <div class="speed-bar-bg"><div class="speed-bar-fill" id="speed-${t.id}" style="width:60%"></div></div>
              <div class="speed-label">Speed</div>
            </div>
            <div class="camera-mode" id="cam-${t.id}">Broadcast</div>
            <div class="click-hint">Click to change camera</div>
          </div>
          <div class="theme-info">
            <div class="theme-number">${t.label}</div>
            <h2 class="theme-title">${t.name}</h2>
            <p class="theme-desc">${t.desc}</p>
            <div class="color-palette">
              ${t.colors.map(c => `<div class="color-swatch" style="background:${c}"></div>`).join('')}
            </div>
            <div class="features">
              ${t.tags.map(tag => `<span class="feature-tag">${tag}</span>`).join('')}
            </div>
          </div>
        </div>
      `;
    });

    // Theme configurations
    const themes = {
      1: { name: 'Classic NFL', sky: [0x1e3a5f, 0x87ceeb], field: 0x15803d, fieldDark: 0x166534, endZone: 0xf97316, lines: 0xffffff, player: 0xf97316, playerHelmet: 0xfbbf24, playerPants: 0xffffff, defender: 0xdc2626, defenderHelmet: 0x1e293b, defenderPants: 0xffffff, obstacle: 0xf97316, coin: 0xfbbf24, crowd: [0x374151, 0xef4444, 0x3b82f6, 0xfbbf24, 0x22c55e], ambient: 0xffffff, ambientIntensity: 0.7, directional: 0xffffff, directionalIntensity: 1.0, bloom: { strength: 0.4, radius: 0.5, threshold: 0.75 } },
      2: { name: 'Night Game', sky: [0x0f172a, 0x1e1b4b], field: 0x064e3b, fieldDark: 0x022c22, endZone: 0x0ea5e9, lines: 0x22d3ee, player: 0x0ea5e9, playerHelmet: 0x22d3ee, playerPants: 0x0f172a, defender: 0x9333ea, defenderHelmet: 0xa855f7, defenderPants: 0x1e1b4b, obstacle: 0xa855f7, coin: 0x22d3ee, crowd: [0x312e81, 0x4c1d95, 0x1e1b4b, 0x6366f1], ambient: 0x6366f1, ambientIntensity: 0.4, directional: 0xffffff, directionalIntensity: 0.5, stadiumLights: true, bloom: { strength: 1.0, radius: 0.7, threshold: 0.4 }, fog: { color: 0x1e1b4b, near: 20, far: 55 } },
      3: { name: 'Retro Arcade', sky: [0x000000, 0x0a0a0a], field: 0x0a0a0a, fieldDark: 0x000000, endZone: 0x22c55e, lines: 0x22c55e, player: 0x22c55e, playerHelmet: 0x4ade80, playerPants: 0x22c55e, defender: 0xef4444, defenderHelmet: 0xf87171, defenderPants: 0xef4444, obstacle: 0xfbbf24, coin: 0xec4899, crowd: [0x22c55e, 0xec4899, 0xfbbf24, 0x06b6d4], ambient: 0x22c55e, ambientIntensity: 0.3, directional: 0xffffff, directionalIntensity: 0.4, emissive: true, gridLines: true, bloom: { strength: 1.5, radius: 0.9, threshold: 0.25 } },
      4: { name: 'Sunset Stadium', sky: [0x7c2d12, 0xfbbf24], field: 0x365314, fieldDark: 0x1a2e05, endZone: 0xfbbf24, lines: 0xfef3c7, player: 0xfbbf24, playerHelmet: 0xfef3c7, playerPants: 0xfbbf24, defender: 0x334155, defenderHelmet: 0x1e293b, defenderPants: 0x1e293b, obstacle: 0xdc2626, coin: 0xfef3c7, crowd: [0x78350f, 0x92400e, 0x451a03, 0xfbbf24], ambient: 0xfbbf24, ambientIntensity: 0.6, directional: 0xffa500, directionalIntensity: 1.5, bloom: { strength: 0.6, radius: 0.8, threshold: 0.5 }, fog: { color: 0xfbbf24, near: 25, far: 65 } },
      5: { name: 'Winter Classic', sky: [0xcbd5e1, 0xf8fafc], field: 0xe2e8f0, fieldDark: 0xf1f5f9, endZone: 0x0ea5e9, lines: 0x0ea5e9, player: 0x0284c7, playerHelmet: 0x0ea5e9, playerPants: 0xffffff, defender: 0x334155, defenderHelmet: 0x1e293b, defenderPants: 0x475569, obstacle: 0x0ea5e9, coin: 0xfbbf24, crowd: [0x64748b, 0x0ea5e9, 0xffffff, 0x94a3b8], ambient: 0xffffff, ambientIntensity: 1.0, directional: 0xffffff, directionalIntensity: 0.6, snow: true, bloom: { strength: 0.5, radius: 0.5, threshold: 0.65 }, fog: { color: 0xe2e8f0, near: 25, far: 60 } },
      6: { name: 'Neon Future', sky: [0x0c0a1d, 0x1a0a2e], field: 0x0c0a1d, fieldDark: 0x050510, endZone: 0xe879f9, lines: 0x06b6d4, player: 0xe879f9, playerHelmet: 0xf0abfc, playerPants: 0xc026d3, defender: 0x06b6d4, defenderHelmet: 0x22d3ee, defenderPants: 0x0891b2, obstacle: 0xf43f5e, coin: 0xfbbf24, crowd: [0x8b5cf6, 0x06b6d4, 0xe879f9, 0xf43f5e], ambient: 0x8b5cf6, ambientIntensity: 0.3, directional: 0xe879f9, directionalIntensity: 0.6, emissive: true, gridLines: true, bloom: { strength: 1.8, radius: 1.1, threshold: 0.15 }, fog: { color: 0x0c0a1d, near: 18, far: 50 } }
    };

    const gameStates = {};
    const cameraModes = ['Broadcast', 'Chase Cam', 'Cinematic', 'Top Down'];

    function createScene(containerId, themeId) {
      const container = document.getElementById(containerId);
      const theme = themes[themeId];
      const isEmissive = theme.emissive || false;

      // Lane system - 5 lanes
      const lanes = [-4.5, -2.25, 0, 2.25, 4.5];
      const laneCount = lanes.length;

      // Game state
      const state = {
        score: 0, coins: 0, speed: 0.7, playerZ: 10, playerX: 0, targetX: 0,
        currentLane: 2, targetLane: 2, // Start in middle lane (index 2)
        laneProgress: 0, laneSwitching: false, laneSwitchDir: 0,
        laneVelocity: 0, // For smooth acceleration
        dodgeTimer: 0, yards: 0, combo: 0, comboTimer: 0, lastCoinTime: 0,
        isJuking: false, jukeType: null, jukeTimer: 0,
        isTackled: false, tackleTimer: 0, tackleRecovery: 0,
        slowMo: false, slowMoTimer: 0, slowMoIntensity: 1,
        screenShake: 0, cameraMode: 0, cameraModeTimer: 0,
        nearMiss: false, nearMissTimer: 0,
        touchdown: false, touchdownTimer: 0,
        boosting: false, boostTimer: 0, shielded: false, shieldTimer: 0,
        dashEffect: 0, // For speed lines during lane switch
        anticipation: 0, // Lean before switching
        // Jumping/hurdle state
        isJumping: false, jumpTimer: 0, jumpHeight: 0, jumpVelocity: 0
      };
      gameStates[themeId] = state;

      // Scene
      const scene = new THREE.Scene();
      if (theme.fog) scene.fog = new THREE.Fog(theme.fog.color, theme.fog.near, theme.fog.far);

      // Sky
      const skyGeometry = new THREE.PlaneGeometry(250, 120);
      const skyMaterial = new THREE.ShaderMaterial({
        uniforms: { topColor: { value: new THREE.Color(theme.sky[0]) }, bottomColor: { value: new THREE.Color(theme.sky[1]) }, time: { value: 0 } },
        vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `uniform vec3 topColor; uniform vec3 bottomColor; uniform float time; varying vec2 vUv; void main() { float g = pow(vUv.y, 0.7); vec3 c = mix(bottomColor, topColor, g); c += 0.015 * sin(vUv.x * 30.0 + time) * sin(vUv.y * 15.0 + time * 0.7); gl_FragColor = vec4(c, 1.0); }`,
        side: THREE.DoubleSide
      });
      const sky = new THREE.Mesh(skyGeometry, skyMaterial);
      sky.position.set(0, 25, -60);
      scene.add(sky);

      // Field
      const fieldGeometry = new THREE.PlaneGeometry(18, 100, 36, 200);
      const fieldMaterial = new THREE.MeshStandardMaterial({ color: theme.field, roughness: 0.85 });
      const field = new THREE.Mesh(fieldGeometry, fieldMaterial);
      field.rotation.x = -Math.PI / 2;
      field.receiveShadow = true;
      scene.add(field);

      // Field stripes
      for (let i = -45; i < 45; i += 5) {
        const stripeGeometry = new THREE.PlaneGeometry(18, 2.5);
        const stripeMaterial = new THREE.MeshStandardMaterial({ color: i % 2 === 0 ? theme.field : theme.fieldDark, roughness: 0.85 });
        const stripe = new THREE.Mesh(stripeGeometry, stripeMaterial);

      // Goal posts
      function createGoalPost(z) {

        cross.position.set(0, 6, z);
        cross.rotation.z = Math.PI / 2;
        g.add(cross);
        [-4, 4].forEach(x => {
          const up = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 6, 10), mat);
          up.position.set(x, 9, z);
          g.add(up);

      // Yard lines

      // Lane guide lines (subtle dashed lines showing the 5 lanes)

      // Stadium stands with crowd

            person.position.set(idx === 0 ? -tier * 0.55 + 1.2 : tier * 0.55 - 1.2, tier * 1.8 + 2, -33 + col * 2.4 + Math.random() * 0.8);

      // Stadium walls with jumbotron

      // Create organic athletic player with smooth curves and muscle definition

        const chestR = new THREE.Mesh(
          new THREE.SphereGeometry(0.28 * s, 24, 24),

        chestR.scale.set(1.1, 0.9, 0.85);
        chestR.position.set(0.12 * s, 1.32 * s, 0.08 * s);

        // Core/back fill

          new THREE.SphereGeometry(0.32 * s, 20, 20),

        coreFill.scale.set(1, 1.2, 0.9);
        coreFill.position.set(0, 1.25 * s, -0.05 * s);
        g.add(coreFill);

        // Midsection (obliques) - tapered

        // Lower abs / hip area
        const hipArea = new THREE.Mesh(
          new THREE.SphereGeometry(0.24 * s, 18, 18),

        hipArea.scale.set(1.2, 0.8, 0.9);
        hipArea.position.set(0, 0.78 * s, 0);
        g.add(hipArea);

        // ===== SHOULDER PADS - Organic curved =====

        const padCore = new THREE.Mesh(
          new THREE.SphereGeometry(0.42 * s, 24, 24),

        padCore.scale.set(1.8, 0.45, 1.1);
        padCore.position.set(0, 1.52 * s, 0);
        g.add(padCore);

        // Shoulder caps - rounded domes
        [-0.58, 0.58].forEach(ox => {
          const shoulderCap = new THREE.Mesh(
            new THREE.SphereGeometry(0.22 * s, 20, 20),

          shoulderCap.scale.set(1.3, 0.8, 1.1);

          g.add(shoulderCap);

        // ===== NECK - organic cylinder =====
        const neck = new THREE.Mesh(
          new THREE.SphereGeometry(0.12 * s, 16, 16),

        );
        neck.scale.set(1, 1.4, 1);
        neck.position.set(0, 1.7 * s, 0);
        g.add(neck);

        // ===== HELMET - Smooth organic =====

        helmetGroup.position.y = 1.92 * s;

        helmetGroup.add(shell);

        // Helmet stripe - curved to follow helmet
        const stripeCurve = new THREE.Mesh(
          new THREE.TorusGeometry(0.32 * s, 0.035 * s, 8, 32, Math.PI),

        // Create curved horizontal bars using torus segments
        for (let i = 0; i < 3; i++) {

        // Vertical bars
        [-0.14, 0, 0.14].forEach(ox => {

          innerThigh.position.set(ox > 0 ? -0.06 * s : 0.06 * s, -0.02 * s, 0);

          thighGroup.position.set(ox * s, 0.48 * s, 0);

          // CALF - Athletic diamond shape

          // Gastrocnemius (main calf muscle)
          const calfMuscle = new THREE.Mesh(
            new THREE.SphereGeometry(0.11 * s, 18, 18),

          // Ankle taper

          calfGroup.position.set(ox * s, 0.12 * s, 0);

          // FOOT/CLEAT - Organic shoe shape

      function spawnSpeedLines(x, z, direction) {

      // Snow

      // Lighting

      // Camera
      const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.1, 200);
      camera.position.set(0, 12, 26);

      // Renderer
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;

      // Post-processing
      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      composer.addPass(new UnrealBloomPass(new THREE.Vector2(container.clientWidth, container.clientHeight), theme.bloom.strength, theme.bloom.radius, theme.bloom.threshold));

      container.querySelector('.loading')?.remove();
      container.insertBefore(renderer.domElement, container.firstChild);

      // Click to change camera
      container.addEventListener('click', () => {
        state.cameraMode = (state.cameraMode + 1) % cameraModes.length;
        document.getElementById(`cam-${themeId}`).textContent = cameraModes[state.cameraMode];
      });

      // Helper functions
      function announce(text, color = '#ffffff') {
        const el = document.getElementById(`announcer-${themeId}`);
        el.textContent = text;
        el.style.color = color;
        el.classList.remove('show');
        void el.offsetWidth;
        el.classList.add('show');
      }

      function spawnTurf(x, z) {
        const pos = turfSys.geometry.attributes.position.array;
        for (let i = 0; i < turfVel.length; i++) {
          if (!turfVel[i].active) {
            pos[i * 3] = x + (Math.random() - 0.5) * 0.4;
            pos[i * 3 + 1] = 0.15;
            pos[i * 3 + 2] = z + (Math.random() - 0.5) * 0.4;
            turfVel[i] = { vx: (Math.random() - 0.5) * 0.1, vy: 0.12 + Math.random() * 0.12, vz: -0.06 - Math.random() * 0.06, active: true, life: 1 };
            break;
          }
        }
        turfSys.geometry.attributes.position.needsUpdate = true;
      }

      function spawnSparkle(x, y, z, count = 10) {
        const pos = sparkSys.geometry.attributes.position.array;
        for (let j = 0; j < count; j++) {
          const i = (Math.floor(Math.random() * sparkCount));
          pos[i * 3] = x;
          pos[i * 3 + 1] = y;
          pos[i * 3 + 2] = z;
          sparkVel[i] = { vx: (Math.random() - 0.5) * 0.2, vy: 0.15 + Math.random() * 0.2, vz: (Math.random() - 0.5) * 0.2, active: true, life: 1 };
        }
        sparkSys.geometry.attributes.position.needsUpdate = true;

      function spawnConfetti(x, z) {
        const pos = confettiSys.geometry.attributes.position.array;
        for (let i = 0; i < confettiCount; i++) {
          pos[i * 3] = x + (Math.random() - 0.5) * 6;
          pos[i * 3 + 1] = 8 + Math.random() * 5;
          pos[i * 3 + 2] = z + (Math.random() - 0.5) * 6;
          confettiVel[i] = { vx: (Math.random() - 0.5) * 0.15, vy: 0.05 + Math.random() * 0.1, vz: (Math.random() - 0.5) * 0.15, active: true, life: 3 };
        }
        confettiSys.geometry.attributes.position.needsUpdate = true;
      }

      // Animation
      let time = 0;
      function animate() {
        requestAnimationFrame(animate);
        const dt = state.slowMo ? 0.004 : 0.016;
        time += dt;

        // Update sky
        skyMaterial.uniforms.time.value = time;

        // Slow motion handling
        if (state.slowMoTimer > 0) {
          state.slowMoTimer -= 0.016;
          if (state.slowMoTimer <= 0) state.slowMo = false;
        }

        // Screen shake
        if (state.screenShake > 0) {
          camera.position.x += (Math.random() - 0.5) * state.screenShake * 0.5;
          camera.position.y += (Math.random() - 0.5) * state.screenShake * 0.3;
          state.screenShake *= 0.9;
        }

        // Tackle recovery
        if (state.tackleRecovery > 0) {
          state.tackleRecovery -= dt;
          player.rotation.x = Math.sin(time * 8) * 0.3;
          player.position.y = Math.abs(Math.sin(time * 6)) * 0.3;
        } else {
          player.rotation.x = 0;
          player.position.y = 0;
        }

        // Juke timer
        if (state.jukeTimer > 0) {
          state.jukeTimer -= dt;
          if (state.jukeType === 'spin') {
            player.rotation.y += 0.4;
          } else if (state.jukeType === 'stiffarm') {
            // Stiff arm visual
          }
        } else {
          state.jukeType = null;
        }

        // Boost timer
        if (state.boostTimer > 0) {
          state.boostTimer -= dt;
          state.boosting = true;
          flameGroup.children.forEach(f => { f.material.opacity = 0.8; f.position.y = 0.3 + Math.random() * 0.2; });
          document.getElementById(`boost-${themeId}`).classList.add('active');
        } else {
          state.boosting = false;
          flameGroup.children.forEach(f => { f.material.opacity = 0; });
          document.getElementById(`boost-${themeId}`).classList.remove('active');
        }

        // Shield timer
        if (state.shieldTimer > 0) {
          state.shieldTimer -= dt;
          state.shielded = true;
          shieldMat.opacity = 0.25 + Math.sin(time * 8) * 0.1;
        } else {
          state.shielded = false;
          shieldMat.opacity = 0;
        }

        // Lane switching logic - much better!
        state.dodgeTimer -= dt;
        if (state.dodgeTimer <= 0 && state.tackleRecovery <= 0 && !state.laneSwitching) {
          state.dodgeTimer = 0.35 + Math.random() * 0.6; // Faster decisions

          // Decide which lane to switch to (weighted toward avoiding defenders)
          let bestLane = state.currentLane;
          let minDanger = Infinity;

          for (let l = 0; l < laneCount; l++) {
            const laneX = lanes[l];
            let danger = 0;
            defenders.forEach(def => {
              const dx = def.position.x - laneX;
              const dz = def.position.z - state.playerZ;
              if (dz < 0 && dz > -15) { // Defender ahead
                danger += 10 / (Math.abs(dx) + 1);
              }
            });
            // Slight preference for center lanes
            danger += Math.abs(l - 2) * 0.3;
            if (danger < minDanger) {
              minDanger = danger;
              bestLane = l;
            }
          }

          // Sometimes make random moves for variety
          if (Math.random() < 0.3) {
            const direction = Math.random() < 0.5 ? -1 : 1;
            bestLane = Math.max(0, Math.min(laneCount - 1, state.currentLane + direction));
          }

          // Initiate lane switch if different from current
          if (bestLane !== state.currentLane) {
            state.targetLane = bestLane;
            state.laneSwitching = true;
            state.laneProgress = 0;
            state.laneSwitchDir = bestLane > state.currentLane ? 1 : -1;
            state.anticipation = 0.08; // Brief anticipation before dash
            state.dashEffect = 1.0;

            // Spawn speed lines in opposite direction of movement
            spawnSpeedLines(player.position.x, player.position.z, -state.laneSwitchDir);

            // Random juke move during lane switch
            if (Math.random() < 0.2) {
              state.jukeType = 'spin';
              state.jukeTimer = 0.35;
              announce('SPIN MOVE!', '#22c55e');
            } else if (Math.random() < 0.12) {
              state.jukeType = 'stiffarm';
              state.jukeTimer = 0.25;
              announce('STIFF ARM!', '#f97316');
            }
          }

          // Random power-up
          if (Math.random() < 0.06) {
            state.boostTimer = 1.5;
            announce('SPEED BOOST!', '#22c55e');
          }
          if (Math.random() < 0.04) {
            state.shieldTimer = 2.0;
            announce('SHIELD!', '#3b82f6');
          }
        }

        // Smooth lane switching with easing
        const baseSpeed = state.boosting ? 1.2 : 0.7;

        if (state.laneSwitching) {
          // Quick anticipation phase (lean into direction)
          if (state.anticipation > 0) {
            state.anticipation -= dt * 3;
          } else {
            // Main lane switch with ease-out cubic
            state.laneProgress += dt * 5.5; // Speed of lane switch
            if (state.laneProgress >= 1) {
              state.laneProgress = 1;
              state.laneSwitching = false;
              state.currentLane = state.targetLane;
            }
          }

          // Ease-out cubic for snappy movement
          const eased = 1 - Math.pow(1 - state.laneProgress, 3);
          const startX = lanes[state.currentLane];
          const endX = lanes[state.targetLane];
          state.targetX = startX + (endX - startX) * eased;
        } else {
          state.targetX = lanes[state.currentLane];
        }

        // Apply position with high-speed interpolation
        const dx = state.targetX - state.playerX;
        const switchSpeed = state.laneSwitching ? 0.35 : 0.15; // Faster during switch
        state.playerX += dx * switchSpeed;
        player.position.x = state.playerX;

        // Dash effect fade
        if (state.dashEffect > 0) {
          state.dashEffect -= dt * 3;
        }
        state.playerZ -= 0.18 * baseSpeed * (state.slowMo ? 0.25 : 1);
        state.yards += 0.18 * baseSpeed * (state.slowMo ? 0.25 : 1);
        player.position.z = state.playerZ;

        // Touchdown
        if (state.playerZ < -45 && !state.touchdown) {
          state.touchdown = true;
          state.touchdownTimer = 2.5;
          state.score += 600;
          announce('TOUCHDOWN!', '#f97316');
          spawnConfetti(player.position.x, player.position.z);
          state.screenShake = 0.8;
          // Celebration - make crowd jump
          crowdPeople.forEach(p => { p.userData.jumping = true; });
        }
        if (state.touchdownTimer > 0) {
          state.touchdownTimer -= dt;
          if (state.touchdownTimer <= 0) {
            state.touchdown = false;
            state.playerZ = 15;
          }
        }
        if (state.playerZ < -48) state.playerZ = 15;

        // Player lean - enhanced for lane switching
        if (state.jukeType !== 'spin') {
          // During lane switch: aggressive lean
          if (state.laneSwitching) {
            const leanIntensity = state.anticipation > 0 ? 0.3 : 0.5;
            player.rotation.z = -state.laneSwitchDir * leanIntensity * (1 + state.dashEffect * 0.5);
            player.rotation.y = state.laneSwitchDir * 0.35;
            // Slight crouch during dash
            player.position.y = Math.max(0, player.position.y - state.dashEffect * 0.15);
          } else {
            // Normal lean based on movement
            player.rotation.z = -dx * 0.25;
            player.rotation.y = dx * 0.15;
          }
        }

        // Realistic running gait cycle animation
        const runSpd = 14 * baseSpeed;
        const gaitCycle = time * runSpd;
        const strideIntensity = state.boosting ? 1.3 : 1.0;
        const laneSwitchMod = state.laneSwitching ? 0.7 : 1.0; // Reduce stride during lane switch

        player.children.forEach(child => {
          // THIGH animation - drives the main leg swing
          if (child.name?.includes('thigh')) {
            const isLeft = child.name.includes('0');
            const phase = isLeft ? 0 : Math.PI;
            const cycle = gaitCycle + phase;

            // Asymmetric swing: faster forward, slower back (like real running)
            const forwardSwing = Math.sin(cycle);
            const backSwing = Math.sin(cycle) * 0.7;
            const thighAngle = forwardSwing > 0 ? forwardSwing * 0.8 : backSwing * 0.6;

            child.rotation.x = thighAngle * strideIntensity * laneSwitchMod;

            // Slight hip rotation during lane switch
            if (state.laneSwitching) {
              child.rotation.z = state.laneSwitchDir * 0.15 * (isLeft ? 1 : -1);
            } else {
              child.rotation.z = 0;
            }
          }

          // CALF/LOWER LEG animation - knee bend during swing phase
          if (child.name?.includes('leg') && !child.name?.includes('thigh')) {
            const isLeft = child.name.includes('0');
            const phase = isLeft ? 0 : Math.PI;
            const cycle = gaitCycle + phase;

            // Knee bends (positive rotation) when leg swings forward
            // This creates the "heel kick" look of sprinting
            const swingPhase = Math.sin(cycle);
            const kneeBend = swingPhase > 0
              ? Math.pow(swingPhase, 1.5) * 1.2  // Strong bend during forward swing
              : swingPhase * 0.2;                 // Slight extension during back swing

            child.rotation.x = kneeBend * strideIntensity * laneSwitchMod;
          }

          // UPPER ARM animation - opposite to legs, drives forward
          if (child.name?.includes('upperArm')) {
            const isLeft = child.name.includes('0');
            const phase = isLeft ? Math.PI : 0; // Opposite to same-side leg
            const cycle = gaitCycle + phase;

            // Arms pump forward and back
            const armSwing = Math.sin(cycle) * 0.55 * strideIntensity;
            child.rotation.x = armSwing * laneSwitchMod;

            // Arms swing slightly outward during lane switch
            if (state.laneSwitching) {
              child.rotation.z = (isLeft ? 0.2 : -0.2) + state.laneSwitchDir * 0.1;
            }
          }

          // FOREARM animation - bends at elbow
          if (child.name?.includes('arm') && !child.name?.includes('upper')) {
            const isLeft = child.name.includes('0');
            const phase = isLeft ? Math.PI : 0;
            const cycle = gaitCycle + phase;

            // Elbow stays bent ~90 degrees, with slight pump
            const elbowBend = -0.8 + Math.sin(cycle) * 0.25 * strideIntensity;
            child.rotation.x = elbowBend;
          }
        });

        // Add subtle body bob (up/down motion while running)
        const bodyBob = Math.abs(Math.sin(gaitCycle * 2)) * 0.08 * strideIntensity;
        if (!state.laneSwitching && state.tackleRecovery <= 0) {
          player.position.y = bodyBob;
        }

        // Spawn turf
        if (Math.random() < 0.4) spawnTurf(player.position.x, player.position.z);

        // OBSTACLE COLLISION DETECTION AND HURDLE MECHANICS
        obstacles.forEach(obs => {
          const ox = obs.position.x;
          const oz = obs.position.z;
          const dx = state.playerX - ox;
          const dz = state.playerZ - oz;
          const dist = Math.sqrt(dx * dx + dz * dz);
          const collisionDist = obs.userData.radius + 0.4; // Player radius ~0.4

          // HURDLES - auto-jump when approaching
          if (obs.userData.type === 'hurdle') {
            // Approach detection - trigger jump
            if (Math.abs(dx) < 1.2 && dz > 0 && dz < 2.5 && !state.isJumping && !obs.userData.cleared) {
              state.isJumping = true;
              state.jumpVelocity = 0.35;
              state.jumpTimer = 0.5;
              announce('HURDLE!', '#22c55e');
              state.score += 25;
              obs.userData.cleared = true;
              obs.userData.clearTimer = 2.0;
            }

            // Reset cleared state after timer
            if (obs.userData.clearTimer > 0) {
              obs.userData.clearTimer -= dt;
              if (obs.userData.clearTimer <= 0) {
                obs.userData.cleared = false;
              }
            }
          }

          // CONES - knock them over on collision
          if (obs.userData.type === 'cone') {
            if (dist < collisionDist && !obs.userData.knocked) {
              obs.userData.knocked = true;
              obs.userData.knockTimer = 3.0;
              obs.userData.knockDir = dx > 0 ? 1 : -1;
              // Small speed penalty
              state.speed *= 0.95;
              state.screenShake = 0.3;
            }

            // Animate knocked cone
            if (obs.userData.knocked) {
              obs.userData.knockTimer -= dt;
              // Rotate and slide
              obs.rotation.x += obs.userData.knockDir * 0.15;
              obs.rotation.z += obs.userData.knockDir * 0.1;
              obs.position.x += obs.userData.knockDir * 0.05;
              obs.position.y = Math.max(0, obs.position.y - 0.02);

              if (obs.userData.knockTimer <= 0) {
                // Reset cone
                obs.userData.knocked = false;
                obs.rotation.set(0, 0, 0);
                obs.position.y = 0;
              }
            }
          }

          // DUMMIES - major collision, stumble
          if (obs.userData.type === 'dummy') {
            if (dist < collisionDist && !obs.userData.hit && state.tackleRecovery <= 0 && state.jumpHeight < 0.5) {
              obs.userData.hit = true;
              obs.userData.hitTimer = 2.0;
              // Stumble effect
              state.tackleRecovery = 0.5;
              state.screenShake = 0.8;
              announce('BLOCKED!', '#ef4444');
              state.speed *= 0.8;
            }

            // Reset dummy state
            if (obs.userData.hit) {
              obs.userData.hitTimer -= dt;
              // Dummy wobbles
              obs.rotation.z = Math.sin(time * 15) * 0.1;
              if (obs.userData.hitTimer <= 0) {
                obs.userData.hit = false;
                obs.rotation.z = 0;
              }
            }
          }
        });

        // JUMPING PHYSICS
        if (state.isJumping) {
          state.jumpHeight += state.jumpVelocity;
          state.jumpVelocity -= 0.025; // Gravity
          state.jumpTimer -= dt;

          if (state.jumpHeight <= 0 || state.jumpTimer <= 0) {
            state.isJumping = false;
            state.jumpHeight = 0;
            state.jumpVelocity = 0;
          }

          // Apply jump height to player (on top of body bob)
          player.position.y = state.jumpHeight + bodyBob;

          // Jumping animation - tuck legs
          player.children.forEach(child => {
            if (child.name?.includes('thigh')) {
              child.rotation.x = 0.8; // Knees up
            }
            if (child.name?.includes('leg') && !child.name?.includes('thigh')) {
              child.rotation.x = 1.2; // Calves tucked
            }
          });
        }

        // Smart Defender AI with pursuit angles, lane blocking, and coordination
        let closestDist = Infinity;
        const playerLane = state.currentLane;
        const playerVelX = state.laneSwitching ? state.laneSwitchDir * 2 : 0;

        defenders.forEach((def, i) => {
          const toX = state.playerX - def.position.x;
          const toZ = state.playerZ - def.position.z;
          const dist = Math.sqrt(toX * toX + toZ * toZ);
          if (dist < closestDist) closestDist = dist;

          // Initialize defender behavior state
          if (!def.userData.behavior) {
            def.userData.behavior = i < 3 ? 'chase' : 'zone'; // First 3 chase, rest zone
            def.userData.assignedLane = i % laneCount; // Each defender covers a lane
            def.userData.sprintTimer = 0;
            def.userData.sprintCooldown = 0;
            def.userData.reactionDelay = Math.random() * 0.3; // Slight delay before reacting
          }

          const baseChaseSpeed = def.userData.chaseSpeed * (state.slowMo ? 0.25 : 1);
          const isSprinting = def.userData.sprintTimer > 0;
          const chaseSpeed = isSprinting ? baseChaseSpeed * 2.2 : baseChaseSpeed;

          // Sprint burst logic
          if (def.userData.sprintCooldown > 0) {
            def.userData.sprintCooldown -= dt;
          }
          if (def.userData.sprintTimer > 0) {
            def.userData.sprintTimer -= dt;
          }
          // Trigger sprint when close and closing in
          if (dist < 8 && dist > 2 && def.userData.sprintCooldown <= 0 && Math.random() < 0.01) {
            def.userData.sprintTimer = 0.8; // Sprint for 0.8 seconds
            def.userData.sprintCooldown = 3.0; // Can't sprint again for 3 seconds
          }

          // BEHAVIOR: CHASE - Direct pursuit with prediction
          if (def.userData.behavior === 'chase') {
            // Predict where player will be
            const predictAhead = 0.5; // Look ahead time
            const predictedX = state.playerX + playerVelX * predictAhead;
            const predictedZ = state.playerZ - 0.18 * baseSpeed * predictAhead * 5;

            const toPredX = predictedX - def.position.x;
            const toPredZ = predictedZ - def.position.z;
            const predDist = Math.sqrt(toPredX * toPredX + toPredZ * toPredZ);

            if (predDist > 1.2) {
              // Pursuit angle - cut off the player's path
              const pursuitAngle = def.position.z > state.playerZ ? 0.4 : 0.8;
              def.position.x += (toPredX / predDist) * chaseSpeed * 1.8 * pursuitAngle;
              def.position.z += (toPredZ / predDist) * chaseSpeed * 1.2;
            }
          }

          // BEHAVIOR: ZONE - Cover assigned lane, move forward to intercept
          if (def.userData.behavior === 'zone') {
            const targetLaneX = lanes[def.userData.assignedLane];
            const laneToX = targetLaneX - def.position.x;

            // Stay in assigned lane
            def.position.x += laneToX * 0.08;

            // Move toward player's Z position to block
            if (def.position.z > state.playerZ - 5) {
              def.position.z -= chaseSpeed * 0.6;
            } else if (def.position.z < state.playerZ - 15) {
              // Reset position if too far behind
              def.position.z = state.playerZ + 20 + Math.random() * 10;
            }

            // Switch to chase if player enters this lane
            if (Math.abs(state.playerX - targetLaneX) < 1.5 && toZ < 0 && toZ > -12) {
              def.userData.behavior = 'chase';
              def.userData.sprintTimer = 0.5; // Burst toward player
            }
          }

          // Return zone defenders to zone behavior after losing player
          if (def.userData.behavior === 'chase' && i >= 3 && dist > 10) {
            def.userData.behavior = 'zone';
          }

          // Team coordination - spread out if too close to another defender
          defenders.forEach((other, j) => {
            if (i !== j) {
              const sepX = def.position.x - other.position.x;
              const sepZ = def.position.z - other.position.z;
              const sepDist = Math.sqrt(sepX * sepX + sepZ * sepZ);
              if (sepDist < 2.5 && sepDist > 0) {
                // Push apart
                def.position.x += (sepX / sepDist) * 0.02;
                def.position.z += (sepZ / sepDist) * 0.01;
              }
            }
          });

          // Boundary limits
          def.position.x = Math.max(-6.5, Math.min(6.5, def.position.x));

          // Face the player
          def.rotation.y = Math.atan2(toX, toZ);

          // Animate defender legs with proper gait cycle (same as player)
          const defRunSpeed = isSprinting ? 18 : 12;
          const defGaitCycle = time * defRunSpeed + i * 1.5;
          def.children.forEach(child => {
            if (child.name?.includes('thigh')) {
              const isLeft = child.name.includes('0');
              const phase = isLeft ? 0 : Math.PI;
              const cycle = defGaitCycle + phase;
              const swing = Math.sin(cycle);
              child.rotation.x = (swing > 0 ? swing * 0.7 : swing * 0.5) * (isSprinting ? 1.3 : 1);
            }
            if (child.name?.includes('leg') && !child.name?.includes('thigh')) {
              const isLeft = child.name.includes('0');
              const phase = isLeft ? 0 : Math.PI;
              const cycle = defGaitCycle + phase;
              const swing = Math.sin(cycle);
              child.rotation.x = swing > 0 ? Math.pow(swing, 1.5) * 1.0 : swing * 0.15;
            }
            if (child.name?.includes('upperArm')) {
              const isLeft = child.name.includes('0');
              const phase = isLeft ? Math.PI : 0;
              child.rotation.x = Math.sin(defGaitCycle + phase) * 0.45;
            }
          });

          // Visual indicator when sprinting
          if (isSprinting) {
            def.position.y = Math.abs(Math.sin(time * 20)) * 0.1;
          } else {
            def.position.y = Math.abs(Math.sin(defGaitCycle * 2)) * 0.05;
          }

          // Tackle detection
          if (dist < 1.0 && state.tackleRecovery <= 0 && !state.shielded) {
            if (Math.random() < 0.35) {
              // Got tackled
              state.tackleRecovery = 0.8;
              state.screenShake = 1.2;
              state.slowMo = true;
              state.slowMoTimer = 0.5;
              announce('TACKLED!', '#ef4444');
              state.combo = 0;
              // Defender celebrates
              def.userData.behavior = 'zone';
            } else {
              // Near miss - juke success
              state.nearMiss = true;
              state.nearMissTimer = 0.3;
              state.slowMo = true;
              state.slowMoTimer = 0.4;
              announce('JUKE!', '#22c55e');
              state.score += 50;
              // Defender stumbles
              def.position.z += 2;
            }
          }
        });

        // Near miss / danger indicator
        if (closestDist < 3) {
          document.getElementById(`danger-${themeId}`).classList.add('active');
        } else {
          document.getElementById(`danger-${themeId}`).classList.remove('active');
        }
        if (state.nearMissTimer > 0) state.nearMissTimer -= dt;

        // Update particles
        const turfPosArr = turfSys.geometry.attributes.position.array;
        turfVel.forEach((v, i) => {
          if (v.active) {
            turfPosArr[i * 3] += v.vx;
            turfPosArr[i * 3 + 1] += v.vy;
            turfPosArr[i * 3 + 2] += v.vz;
            v.vy -= 0.01;
            v.life -= 0.03;
            if (v.life <= 0 || turfPosArr[i * 3 + 1] < 0) {
              v.active = false;
              turfPosArr[i * 3 + 1] = -20;
            }
          }
        });
        turfSys.geometry.attributes.position.needsUpdate = true;

        const sparkPosArr = sparkSys.geometry.attributes.position.array;
        sparkVel.forEach((v, i) => {
          if (v.active) {
            sparkPosArr[i * 3] += v.vx;
            sparkPosArr[i * 3 + 1] += v.vy;
            sparkPosArr[i * 3 + 2] += v.vz;
            v.vy -= 0.008;
            v.life -= 0.04;
            if (v.life <= 0) {
              v.active = false;
              sparkPosArr[i * 3 + 1] = -20;
            }
          }
        });
        sparkSys.geometry.attributes.position.needsUpdate = true;

        const confPosArr = confettiSys.geometry.attributes.position.array;
        confettiVel.forEach((v, i) => {
          if (v.active) {
            confPosArr[i * 3] += v.vx + Math.sin(time * 3 + i) * 0.02;
            confPosArr[i * 3 + 1] -= 0.05;
            confPosArr[i * 3 + 2] += v.vz + Math.cos(time * 2 + i) * 0.02;
            v.life -= 0.02;
            if (v.life <= 0 || confPosArr[i * 3 + 1] < 0) {
              v.active = false;
              confPosArr[i * 3 + 1] = -20;
            }
          }
        });
        confettiSys.geometry.attributes.position.needsUpdate = true;

        // Speed line particles (lane switch effect)
        const speedLinePosArr = speedLineSys.geometry.attributes.position.array;
        speedLineVel.forEach((v, i) => {
          if (v.active) {
            speedLinePosArr[i * 3] += v.vx;
            speedLinePosArr[i * 3 + 1] += v.vy;
            speedLinePosArr[i * 3 + 2] += v.vz;
            v.life -= dt * 2;
            speedLineSys.material.opacity = v.life * 0.9;
            if (v.life <= 0) {
              v.active = false;
              speedLinePosArr[i * 3 + 1] = -20;
            }
          }
        });
        speedLineSys.geometry.attributes.position.needsUpdate = true;

        // Coin collection
        const now = time;
        coins.forEach((cg, i) => {
          if (!cg.userData.collected) {
            cg.rotation.y += 0.07;
            cg.position.y = 0.9 + Math.sin(time * 4 + i * 0.7) * 0.2;
            const ring = cg.children[2];
            if (ring) ring.scale.setScalar(1 + Math.sin(time * 6 + i) * 0.15);

            const cdx = cg.position.x - player.position.x;
            const cdz = cg.position.z - player.position.z;
            if (Math.abs(cdx) < 0.9 && Math.abs(cdz) < 0.9) {
              cg.userData.collected = true;
              spawnSparkle(cg.position.x, cg.position.y, cg.position.z, 12);
              cg.visible = false;

              // Combo system
              if (now - state.lastCoinTime < 1.5) {
                state.combo = Math.min(state.combo + 1, 10);
                state.comboTimer = 2;
              } else {
                state.combo = 1;
                state.comboTimer = 2;
              }
              state.lastCoinTime = now;

              const points = 100 * state.combo;
              state.coins++;
              state.score += points;

              if (state.combo >= 3) {
                announce(`x${state.combo} COMBO!`, '#fbbf24');
              }

              setTimeout(() => { cg.userData.collected = false; cg.visible = true; }, 2500);
            }
          }
        });

        // Combo timer
        if (state.comboTimer > 0) {
          state.comboTimer -= dt;
          document.getElementById(`combo-${themeId}`).classList.add('active');
          document.getElementById(`combo-val-${themeId}`).textContent = `x${state.combo}`;
        } else {
          state.combo = 0;
          document.getElementById(`combo-${themeId}`).classList.remove('active');
        }

        // Update trail
        trails.forEach((t, i) => {
          t.position.x = player.position.x * (1 - i * 0.06);
          t.position.z = player.position.z + 0.55 + i * 0.35;
          t.position.y = 0.28 + Math.sin(time * 12 + i) * 0.05;
        });

        // Crowd animation
        crowdPeople.forEach((p, i) => {
          if (p.userData.jumping) {
            p.position.y = p.userData.baseY + Math.abs(Math.sin(time * 8 + i * 0.2)) * 0.6;
          } else {
            const wave = time * p.userData.speed - i * 0.08;
            p.position.y = p.userData.baseY + Math.max(0, Math.sin(wave)) * 0.35;
          }
        });
        // Reset jumping after touchdown
        if (!state.touchdown) crowdPeople.forEach(p => { p.userData.jumping = false; });

        // Flags
        flags.forEach((f, i) => {
          const pos = f.geometry.attributes.position;
          for (let j = 0; j < pos.count; j++) {
            const x = pos.getX(j);
            pos.setZ(j, Math.sin(time * 4 + x * 2.5 + i) * 0.18);
          }
          pos.needsUpdate = true;
        });

        // Snow
        if (snowSys) {
          const sp = snowSys.geometry.attributes.position.array;
          for (let i = 0; i < sp.length; i += 3) {
            sp[i + 1] -= 0.05;
            if (sp[i + 1] < 0) sp[i + 1] = 30;
            sp[i] += Math.sin(time * 0.4 + i) * 0.018;
          }
          snowSys.geometry.attributes.position.needsUpdate = true;
        }

        // Camera modes
        const camMode = state.cameraMode;
        let camX = 0, camY = 12, camZ = 26, lookX = 0, lookY = 1, lookZ = 0;

        if (camMode === 0) { // Broadcast
          camX = state.playerX * 0.3;
          camY = 11 + Math.sin(time * 0.6) * 0.6;
          camZ = state.playerZ + 16;
          lookX = state.playerX * 0.5;
          lookZ = state.playerZ - 6;
        } else if (camMode === 1) { // Chase cam
          camX = state.playerX * 0.8;
          camY = 4;
          camZ = state.playerZ + 6;
          lookX = state.playerX;
          lookZ = state.playerZ - 8;
          lookY = 1.5;
        } else if (camMode === 2) { // Cinematic
          camX = Math.sin(time * 0.3) * 8;
          camY = 8 + Math.sin(time * 0.5) * 3;
          camZ = state.playerZ + Math.cos(time * 0.3) * 12;
          lookX = state.playerX;
          lookZ = state.playerZ;
        } else if (camMode === 3) { // Top down
          camX = state.playerX * 0.5;
          camY = 22;
          camZ = state.playerZ + 5;
          lookX = state.playerX;
          lookZ = state.playerZ;
          lookY = 0;
        }

        camera.position.x += (camX - camera.position.x) * 0.06;
        camera.position.y += (camY - camera.position.y) * 0.06;
        camera.position.z += (camZ - camera.position.z) * 0.04;
        camera.lookAt(lookX, lookY, lookZ);

        // Update HUD
        document.getElementById(`score-${themeId}`).textContent = Math.floor(state.score).toLocaleString();
        document.getElementById(`coins-${themeId}`).textContent = state.coins;
        document.getElementById(`yards-${themeId}`).textContent = `${Math.floor(state.yards)} YDS`;
        document.getElementById(`speed-${themeId}`).style.width = `${(baseSpeed / 1.2) * 100}%`;

        composer.render();
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
        composer.setSize(container.clientWidth, container.clientHeight);
      });
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      for (let i = 1; i <= 6; i++) setTimeout(() => createScene(`preview-${i}`, i), i * 250);
    });
  </script>
</body>
</html>
