<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Blitz Rush - Option 4: Mobile Gaming</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(180deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      padding-bottom: 120px;
    }

    .container {
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    /* Coins display at top */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .coin-display {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 50px;
    }

    .coin-display .icon {
      font-size: 20px;
    }

    .coin-display .amount {
      font-size: 16px;
      font-weight: 700;
      color: white;
    }

    .settings-btn {
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      border: none;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
    }

    /* Main game card */
    .game-card {
      background: white;
      border-radius: 32px;
      padding: 32px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      margin-bottom: 20px;
    }

    .game-icon {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      margin: 0 auto 20px;
      box-shadow: 0 10px 30px rgba(249,115,22,0.4);
    }

    h1 {
      font-size: 32px;
      font-weight: 800;
      color: #1a1a1a;
      margin-bottom: 4px;
    }

    .tagline {
      font-size: 14px;
      color: #888;
      margin-bottom: 24px;
    }

    /* Mode toggle */
    .mode-toggle {
      display: flex;
      background: #f5f5f5;
      border-radius: 16px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .mode-option {
      flex: 1;
      padding: 14px;
      border: none;
      background: transparent;
      border-radius: 12px;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #888;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .mode-option.selected {
      background: white;
      color: #1a1a1a;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    /* Difficulty chips */
    .difficulty-chips {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 10px 20px;
      border: 2px solid #eee;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      color: #888;
      background: white;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip:hover {
      border-color: #ddd;
    }

    .chip.selected {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-color: transparent;
    }

    /* Big play button */
    .play-btn {
      width: 100%;
      padding: 20px;
      font-family: 'Poppins', sans-serif;
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      color: white;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(34,197,94,0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .play-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(34,197,94,0.5);
    }

    .play-btn:active {
      transform: translateY(0);
    }

    .play-btn .icon {
      font-size: 24px;
    }

    /* Stats row */
    .stats-row {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .stat-card {
      flex: 1;
      background: #f8f8f8;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
    }

    .stat-card .value {
      font-size: 22px;
      font-weight: 800;
      color: #1a1a1a;
    }

    .stat-card .label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Bottom nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      padding: 12px 24px 28px;
      display: flex;
      justify-content: space-around;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
      border-radius: 24px 24px 0 0;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .nav-item:hover {
      background: #f5f5f5;
    }

    .nav-item.active {
      background: linear-gradient(135deg, rgba(102,126,234,0.1) 0%, rgba(118,75,162,0.1) 100%);
    }

    .nav-item .icon {
      font-size: 24px;
    }

    .nav-item .label {
      font-size: 10px;
      font-weight: 600;
      color: #888;
    }

    .nav-item.active .label {
      color: #764ba2;
    }

    /* Floating notification */
    .notification {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      color: #1a1a1a;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(251,191,36,0.4);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .design-label {
      position: fixed;
      top: 20px;
      left: 20px;
      background: white;
      color: #764ba2;
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="design-label">Option 4: Mobile Gaming</div>

  <div class="notification">
    🔥 Daily Challenge Active!
  </div>

  <div class="container">
    <div class="top-bar">
      <div class="coin-display">
        <span class="icon">🪙</span>
        <span class="amount">847</span>
      </div>
      <button class="settings-btn">⚙️</button>
    </div>

    <div class="game-card">
      <div class="game-icon">🏈</div>
      <h1>Blitz Rush</h1>
      <p class="tagline">Dodge, run, score!</p>

      <div class="mode-toggle">
        <button class="mode-option selected">
          <span>♾️</span> Endless
        </button>
        <button class="mode-option">
          <span>🏆</span> Campaign
        </button>
      </div>

      <div class="difficulty-chips">
        <div class="chip selected">🌟 Easy</div>
        <div class="chip">💪 Normal</div>
        <div class="chip">🔥 Hard</div>
      </div>

      <button class="play-btn">
        <span class="icon">▶️</span>
        Play Now
      </button>

      <div class="stats-row">
        <div class="stat-card">
          <div class="value">12.4K</div>
          <div class="label">Best Score</div>
        </div>
        <div class="stat-card">
          <div class="value">23</div>
          <div class="label">TDs</div>
        </div>
        <div class="stat-card">
          <div class="value">5</div>
          <div class="label">Streak</div>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active">
      <span class="icon">🏠</span>
      <span class="label">Home</span>
    </button>
    <button class="nav-item">
      <span class="icon">🎨</span>
      <span class="label">Players</span>
    </button>
    <button class="nav-item">
      <span class="icon">🏪</span>
      <span class="label">Shop</span>
    </button>
    <button class="nav-item">
      <span class="icon">🏆</span>
      <span class="label">Ranks</span>
    </button>
  </nav>
</body>
</html>
