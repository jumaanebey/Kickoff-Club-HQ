<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blitz Rush - Option 5: Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }

    /* Ambient glow effects */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 20%, rgba(249,115,22,0.08) 0%, transparent 40%),
                  radial-gradient(circle at 70% 80%, rgba(34,197,94,0.06) 0%, transparent 40%);
      animation: ambientMove 20s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes ambientMove {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-5%, 5%); }
    }

    .container {
      max-width: 440px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    /* Logo area */
    .logo-container {
      margin-bottom: 48px;
    }

    .game-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      position: relative;
    }

    .game-icon::before {
      content: '🏈';
      font-size: 56px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .game-icon::after {
      content: '';
      position: absolute;
      inset: -10px;
      background: linear-gradient(135deg, rgba(249,115,22,0.3), rgba(234,88,12,0.1));
      border-radius: 50%;
      filter: blur(20px);
      z-index: -1;
    }

    h1 {
      font-size: 42px;
      font-weight: 700;
      color: white;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 14px;
      font-weight: 400;
      color: rgba(255,255,255,0.4);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* Glass card */
    .glass-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 32px;
      backdrop-filter: blur(20px);
      margin-bottom: 24px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 16px;
      text-align: left;
    }

    .mode-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .mode-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 24px 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .mode-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(249,115,22,0.1), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .mode-card:hover {
      border-color: rgba(255,255,255,0.1);
      transform: translateY(-2px);
    }

    .mode-card.selected {
      border-color: rgba(249,115,22,0.5);
      background: rgba(249,115,22,0.08);
    }

    .mode-card.selected::before {
      opacity: 1;
    }

    .mode-card .icon {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .mode-card .name {
      font-size: 15px;
      font-weight: 600;
      color: white;
      margin-bottom: 4px;
    }

    .mode-card .desc {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
    }

    /* Difficulty slider style */
    .difficulty-track {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 0;
    }

    .diff-option {
      flex: 1;
      padding: 14px 8px;
      border: none;
      background: transparent;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .diff-option:hover {
      color: rgba(255,255,255,0.7);
    }

    .diff-option.selected {
      background: rgba(255,255,255,0.1);
      color: white;
    }

    /* Play button */
    .play-btn {
      width: 100%;
      padding: 20px 40px;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: white;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .play-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .play-btn:hover::before {
      opacity: 1;
    }

    .play-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 40px rgba(249,115,22,0.3);
    }

    /* Secondary buttons */
    .secondary-row {
      display: flex;
      gap: 12px;
    }

    .secondary-btn {
      flex: 1;
      padding: 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      color: rgba(255,255,255,0.6);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .secondary-btn:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.12);
      color: white;
    }

    .secondary-btn .icon {
      font-size: 16px;
    }

    /* Stats footer */
    .stats-footer {
      display: flex;
      justify-content: center;
      gap: 48px;
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .stat {
      text-align: center;
    }

    .stat .value {
      font-size: 28px;
      font-weight: 700;
      color: white;
      margin-bottom: 4px;
    }

    .stat .value.gold {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stat .label {
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .design-label {
      position: fixed;
      top: 20px;
      left: 20px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="design-label">Option 5: Premium</div>

  <div class="container">
    <div class="logo-container">
      <div class="game-icon"></div>
      <h1>Blitz Rush</h1>
      <p class="tagline">Endless Football Runner</p>
    </div>

    <div class="glass-card">
      <div class="section-label">Game Mode</div>
      <div class="mode-options">
        <div class="mode-card selected">
          <div class="icon">♾️</div>
          <div class="name">Endless</div>
          <div class="desc">No limits</div>
        </div>
        <div class="mode-card">
          <div class="icon">🏆</div>
          <div class="name">Campaign</div>
          <div class="desc">12 levels</div>
        </div>
      </div>

      <div class="section-label">Difficulty</div>
      <div class="difficulty-track">
        <button class="diff-option selected">Easy</button>
        <button class="diff-option">Normal</button>
        <button class="diff-option">Hard</button>
        <button class="diff-option">Expert</button>
      </div>
    </div>

    <button class="play-btn">Start Game</button>

    <div class="secondary-row">
      <button class="secondary-btn">
        <span class="icon">🎨</span>
        Players
      </button>
      <button class="secondary-btn">
        <span class="icon">🏪</span>
        Shop
      </button>
      <button class="secondary-btn">
        <span class="icon">⚙️</span>
        Settings
      </button>
    </div>

    <div class="stats-footer">
      <div class="stat">
        <div class="value">12,450</div>
        <div class="label">High Score</div>
      </div>
      <div class="stat">
        <div class="value gold">847</div>
        <div class="label">Coins</div>
      </div>
      <div class="stat">
        <div class="value">23</div>
        <div class="label">Touchdowns</div>
      </div>
    </div>
  </div>
</body>
</html>
